{% load i18n %}
{% if not instance.return_status %}
    <div class="flex items-center justify-center" onclick="event.stopPropagation()">
        <button
            href="#"
            class="oh-btn oh-btn--secondary"
            role="button"
            data-toggle="oh-modal-toggle"
            data-target="#objectCreateModal"
            hx-get="{% url 'asset-allocate-return'  assignment_id=instance.id %}"
            hx-target="#objectCreateModalTarget"
        >
            <ion-icon name="return-down-back-sharp"></ion-icon>{% trans "Return" %}
        </button>
    </div>
{% else %}
    <div class="flex items-center justify-center">
        <div class="d-flex align-items-center">
            <span class="oh-dot oh-dot--small me-1 oh-dot--color oh-dot--info"></span>
            <span class="link-primary"> {% trans "Returned" %} </span>
        </div>
    </div>
{% endif %}
