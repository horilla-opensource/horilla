{% extends "index.html" %}
{% load i18n static %}

{% block content %}
    <style>
        .oh-modal_close--custom {
            position: absolute;
            top: 25px;
            right: 15px;
            border: none;
            background: none;
            font-size: 1.5rem;
            opacity: 0.7;
        }
    </style>

    <div hx-get="{% url 'nav-asset-request-allocation' %}?{{ request.GET.urlencode }}" hx-trigger="load"></div>

    <script>
        (function () {
            // This page's "Asset Request" tab and its page-level nav both
            // render their own #filterTagContainerSectionNav (a hardcoded,
            // non-unique id from the shared filter_tags.html partial), and
            // the nav's is always first in the DOM. Its own close-button
            // handler (bound in filter_tags.html, via clearFilterFromTag)
            // always resolves to the FIRST #applyFilter it finds -- the
            // page-level nav's own form (AssetAllocationFilter), which has
            // no "asset_request_status" field at all -- so a click on the
            // "Asset request status" chip's x silently resets the wrong
            // form and the chip never actually clears. Rather than change
            // the shared, widely-reused filter_tags.html/clearFilter.js
            // (real regression risk elsewhere), intercept just this one
            // field's close button in the capture phase (runs before the
            // bubble-phase handler that's actually broken) and handle it
            // ourselves: drop the deep-link session value the normal way
            // (see RequestAndAllocationView.get / AssetRequestList) by
            // reloading this page with the field explicitly empty.
            // Same story for the "Clear All" (x) button at the far right of
            // the Filters row -- a separate element/handler (clearAllFilter)
            // from the per-field close buttons above, but resolving to the
            // same wrong #applyFilter for the same reason.
            document.addEventListener("click", function (e) {
                var tagClose = e.target.closest('[data-x-field="asset_request_status"]');
                var clearAll = e.target.closest(".clear-all");
                if (!tagClose) {
                    // Only hijack "Clear All" when the deep-link chip is
                    // actually part of what it'd be clearing -- otherwise
                    // this would hijack a legitimate clear-all click on an
                    // unrelated filter (e.g. on the Asset Allocation tab)
                    // and wrongly force-navigate to the Request tab.
                    if (!clearAll || !document.querySelector('[data-x-field="asset_request_status"]')) {
                        return;
                    }
                }
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                window.location.href = "{% url 'asset-request-allocation-view' %}?open_tab=2&asset_request_status=";
            }, true);
        })();
    </script>

    {% include "generic/components.html" %}

    <div
        class="oh-checkpoint-badge mb-2"
        id="selectedInstances"
        data-ids="[]"
        data-clicked=""
        style="display: none"
    >
    </div>
    <div
        class="oh-checkpoint-badge mb-2"
        id="assetlistInstances"
        data-ids="[]"
        data-clicked=""
        style="display: none"
    >
    </div>

    <div class="oh-wrapper" id="listContainer">
    </div>

    <div
        class="oh-modal"
        id="addAssetReport"
        role="dialog"
        aria-labelledby="addAssetReport"
        aria-hidden="true"
        style="z-index: 1022"
    >
        <div class="oh-modal__dialog">
            <div class="oh-modal__dialog-header">
                <h2 class="oh-modal__dialog-title" id="addAssetReportLabel">
                    {% trans "Add Asset Report" %}
                </h2>
                <button
                    type="button"
                    class="oh-modal_close--custom"
                    onclick="$('#addAssetReport').removeClass('oh-modal--show')"
                >
                    <ion-icon
                        name="close-outline"
                        role="img"
                        aria-label="{% trans 'close outline' %}"
                    ></ion-icon>
                </button>
            </div>
            <div class="oh-modal__dialog-body" id="addAssetReportForm"></div>
        </div>
    </div>

    <div
        class="oh-modal"
        id="assetFineModal"
        role="dialog"
        aria-labelledby="assetFineModal"
        aria-hidden="true"
        style="z-index: 1022"
    >
        <div class="oh-modal__dialog" id="assetFineModalBody">
            <!-- Modal content goes here -->
        </div>
    </div>

    <script>
        $(document).ready(function () {
        	$("#assetFineModalBody").on("htmx:afterSwap", function () {
        		$("[name='installment_amount']").on("change keyup", function () {
        			var loanAmount = $("[name='loan_amount']").val();
        			var installmentAmount = $(this).val();

        			var installments = loanAmount / installmentAmount;
        			$("[name='installments']").val(installments);
        			if (Math.round(installments) !== installments) {
        				installments = Math.round(installments);
        				$("[name='installments']").val(installments);
        				$("[name='installments']").trigger("change");
        			}
        		});

        		$("[name='loan_amount']").on("change keyup", function () {
        			var loanAmount = $("[name='loan_amount']").val();
        			if (loanAmount) {
        				$("[name='installments']").val(1);
        			} else {
        				$("[name='installments']").val("");
        			}
        			$("[name='installments']").change();
        		});

        		$("[name='installments']").on("change keyup", function () {
        			var loanAmount = $("[name='loan_amount']").val();
        			var installments = $(this).val();
        			var installmentAmount = loanAmount / installments;
        			$("[name='installment_amount']").val(installmentAmount);
        		});
        	});
        });
    </script>
{% endblock %}
