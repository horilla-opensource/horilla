{% load i18n %}
{% load widget_tweaks %}
<div class="oh-dropdown__filter-body">
    <div class="oh-accordion">
        <div class="oh-accordion-header">
            {% trans "Asset Request" %}
        </div>
        <div class="oh-accordion-body">
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-6">
                    <div class="oh-input-group">
                        <label
                            class="oh-label"
                            for="{{form.requested_employee_id.id_for_label}}"
                        >{% trans "Requested Employee" %}</label>
                        {{ form.requested_employee_id }}
                    </div>
                    <div class="oh-input-group">
                        <label
                            class="oh-label"
                            for="{{form.asset_category_id.id_for_label}}"
                        >{% trans "Asset Category" %}</label>
                        {{ form.asset_category_id }}
                    </div>
                </div>
                <div class="col-sm-12 col-md-12 col-lg-6">
                    <div class="oh-input-group">
                        <label
                            class="oh-label"
                            for="{{form.asset_request_date.id_for_label}}"
                        >{% trans "Asset Request Date" %}</label>
                        {{ form.asset_request_date|attr:"type:date" }}
                    </div>
                    <div class="oh-input-group">
                        <label
                            class="oh-label"
                            for="{{form.asset_request_status.id_for_label}}"
                        >{% trans "Status" %}</label>
                        {{ form.asset_request_status }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
