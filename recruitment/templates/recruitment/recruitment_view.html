{% extends 'index.html' %} {% block content %}{% load i18n %}
<div class="oh-wrapper">
	{% include 'recruitment/nav.html' %}
  	<!-- start of quick filters -->
	<div class="d-flex flex-row-reverse">

		<span class="m-1" style="margin-left: 15px;cursor: pointer;" onclick="$('[name=closed]').val('false'); $('[name=closed]').first().change(); $('.filterButton').click()" style="cursor: pointer">
		  <span class="oh-dot oh-dot--small me-1" style="background-color:yellowgreen"></span>
		  {% trans "Open" %}
		</span>
		<span class="m-1" style="margin-left: 15px;cursor: pointer;" onclick="$('[name=closed]').val('true'); $('[name=closed]').first().change(); $('.filterButton').click()" style="cursor: pointer">
		  <span class="oh-dot oh-dot--small me-1" style="background-color:red" ></span>
		  {% trans "Closed" %}
		</span>
	</div>
  	<!-- end of quick filters -->

	<div id="recruitment-container">
		{% include 'recruitment/recruitment_component.html' %}
	</div>
</div>

<script>
	function toggleLinkedIn(){
		const isEnabled = $("#id_publish_in_linkedin").is(":checked");
		// The whole field (label and select) is one block, hidden with an inline
		// style: a d-none class on the label's "flex" wrapper loses to its display.
		const field = $("#id_linkedin_account_id_parent_div");
		if (field.length) {
			field.toggle(isEnabled);
			return;
		}
		const linkedInInput = $("[name='linkedin_account_id']");
		const inputContainer = linkedInInput.closest('div');
		const labelContainer = linkedInInput
			.closest(".col-12, .col-sm-12, .col-md-12, .col-lg-6, .col-lg-4")
			.find("label")
			.first()
			.parent();
		inputContainer.toggleClass("d-none", !isEnabled);
		if (labelContainer.length) {
			labelContainer.toggleClass("d-none", !isEnabled);
		}
	};
</script>
{% endblock %}
