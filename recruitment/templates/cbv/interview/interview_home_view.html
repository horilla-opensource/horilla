{% extends "index.html" %}
{% load static %}
{% load i18n %}
{% block content %}
<meta name="csrf-token" content="{{ csrf_token }}">
<div hx-get="{% url "interview-nav-view" %}" hx-trigger="load">
</div>


{% include "generic/components.html" %}
<div class="oh-checkpoint-badge mb-2" id="selectedInstances" data-ids="[]" data-clicked="" style="display: none">
</div>


<div class="oh-wrapper"
   id="listContainer">
</div>


<div class="oh-activity-sidebar" id="leaveactivitySidebar" style="z-index:1000;">
    <div class="oh-activity-sidebar__body" id="commentContainer">
    </div>
  </div>


<script src="{% static 'cbv/leave_requests/leave_requests.js' %}"></script>

<style>
    .oh-avatar-stack {
        position: relative;
        display: inline-block;
    }
    .oh-avatar-stack__images {
        display: flex;
        align-items: center;
    }
    .oh-avatar-stack__img {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        margin-left: -10px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #596376;
        overflow: hidden;
    }
    .oh-avatar-stack__img:first-child {
        margin-left: 0;
    }
    .oh-avatar-stack__img img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
    }
    .oh-avatar-stack__more {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #8c98a8;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
    }
    .oh-avatar-stack__empty {
        color: #8c98a8;
        font-size: 12px;
    }
    .oh-avatar-stack__popover-content {
        display: none;
    }
    .oh-avatar-float-popover {
        display: none;
        position: fixed;
        z-index: 9999;
        min-width: 180px;
        max-width: 240px;
        max-height: 220px;
        overflow-y: auto;
        padding: 8px;
        background: #fff;
        border: 1px solid #e4e6ea;
        border-radius: 8px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .12);
    }
    .oh-avatar-stack__popover-title {
        margin-bottom: 6px;
        padding: 0 4px;
        color: #8c98a8;
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
        text-transform: uppercase;
    }
    .oh-avatar-stack__popover-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px;
        border-radius: 6px;
        color: #2b2b2b;
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
    }
    .oh-avatar-stack__popover-row:hover {
        background: #f4f6f8;
    }
    .oh-avatar-stack__popover-row img {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        border-radius: 50%;
        object-fit: cover;
    }
    .oh-avatar-stack__popover-row span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
</style>

<script>
    $(function () {
        var $floatPop = $("#interviewAvatarFloatPopover");
        if (!$floatPop.length) {
            $floatPop = $('<div id="interviewAvatarFloatPopover" class="oh-avatar-float-popover"></div>').appendTo("body");
        }
        var hideTimer = null;

        function showFor($stack) {
            clearTimeout(hideTimer);
            var $src = $stack.find(".oh-avatar-stack__popover-content");
            if (!$src.length) {
                return;
            }
            $floatPop.html($src.html());
            var rect = $stack[0].getBoundingClientRect();
            var left = rect.left;
            if (left + 220 > window.innerWidth - 8) {
                left = window.innerWidth - 228;
            }
            var top = rect.bottom + 6;
            if (top + 220 > window.innerHeight - 8) {
                top = rect.top - 226;
            }
            $floatPop.css({ left: left + "px", top: top + "px", display: "block" });
        }

        function scheduleHide() {
            hideTimer = setTimeout(function () {
                $floatPop.hide();
            }, 150);
        }

        $(document)
            .off(".interviewStack")
            .on("mouseenter.interviewStack", ".oh-avatar-stack", function () {
                showFor($(this));
            })
            .on("mouseleave.interviewStack", ".oh-avatar-stack", scheduleHide);

        $floatPop
            .off(".interviewStack")
            .on("mouseenter.interviewStack", function () {
                clearTimeout(hideTimer);
            })
            .on("mouseleave.interviewStack", scheduleHide);
    });
</script>
{% endblock content %}
