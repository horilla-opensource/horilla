    /* Managers/Open Positions avatar-stack columns -- same component as
       pms/templates/cbv/objectives/objectives.html: up to 3 overlapping
       avatars, a "+N" badge for the rest, and a shared floating popover
       (JS below) listing everyone/everything on hover. Duplicated here
       rather than shared, matching how this codebase already repeats
       page-scoped component styles (e.g. the .avatars/.avatars__item
       stack used across a dozen templates) instead of a common include. */
    .oh-avatar-stack {
        position: relative;
        display: inline-block;
    }
    .oh-avatar-stack__images {
        display: flex;
        align-items: center;
    }
    .oh-avatar-stack__img {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
        margin-left: -10px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #596376;
        overflow: hidden;
    }
    .oh-avatar-stack__img:first-child {
        margin-left: 0;
    }
    .oh-avatar-stack__img img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
    }
    .oh-avatar-stack__more {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #8c98a8;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
    }
    .oh-avatar-stack__empty {
        color: #8c98a8;
        font-size: 12px;
    }
    .oh-avatar-stack__popover-content {
        display: none;
    }
    .oh-avatar-float-popover {
        display: none;
        position: fixed;
        z-index: 9999;
        min-width: 180px;
        max-width: 260px;
        max-height: 220px;
        overflow-y: auto;
        padding: 8px;
        background: #fff;
        border: 1px solid #e4e6ea;
        border-radius: 8px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, .12);
    }
    .oh-avatar-stack__popover-title {
        margin-bottom: 6px;
        padding: 0 4px;
        color: #8c98a8;
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
        text-transform: uppercase;
    }
    .oh-avatar-stack__popover-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px;
        border-radius: 6px;
        color: #2b2b2b;
        font-size: 12px;
        line-height: 16px;
        font-weight: 600;
    }
    .oh-avatar-stack__popover-row:hover {
        background: #f4f6f8;
    }
    .oh-avatar-stack__popover-row img {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        border-radius: 50%;
        object-fit: cover;
    }
    .oh-avatar-stack__popover-row span {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .oh-avatar-stack__popover-remove {
        flex-shrink: 0;
        color: #b7b5ac;
        cursor: pointer;
    }
    .oh-avatar-stack__popover-remove:hover {
        color: #dc3545;
    }

  </style>

<script>
    function copyLink(link){
        var $temp = $("<input>");
        var $url = $(location).attr('href');
        $("body").append($temp);
        $temp.val(link).select();
        document.execCommand("copy");
        $temp.remove();
        Swal.fire({
          text: "{% trans 'Link copied'|escapejs %}",
          icon: "success",
          showConfirmButton: false,
          timer: 3000, // Set the timer to 3000 milliseconds (3 seconds)
          timerProgressBar: true, // Show a progress bar as the timer counts down
        });
      }

      function toggleLinkedIn() {
        const isEnabled = $("#id_publish_in_linkedin").is(":checked");
        // The whole field (label and select) is one block, #<field>_parent_div.
        // Hide that block with an inline style: the label's own wrapper is a
        // "flex" element, and a d-none class on it loses to the flex display, so
        // the label stayed visible while only the select was hidden.
        const field = $("#id_linkedin_account_id_parent_div");
        if (field.length) {
          field.toggle(isEnabled);
          return;
        }
        const linkedInInput = $("[name='linkedin_account_id']");
        const inputContainer = linkedInInput.closest("div");
        inputContainer.toggleClass("d-none", !isEnabled);
        inputContainer.parent().find("label").parent().toggleClass("d-none", !isEnabled);
      }

      // Managers/Open Positions avatar-stack hover popover. Delegated on
      // document (survives htmx swaps of #listContainer) and uses a single
      // body-level element repositioned per hover, since a popover
      // positioned inside the table cell would be clipped by the cell's
      // overflow:hidden ancestor. Mirrors the same script in
      // pms/templates/cbv/objectives/objectives.html.
      (function () {
          var floatPop = document.getElementById("recAvatarFloatPopover");
          if (!floatPop) {
              floatPop = document.createElement("div");
              floatPop.id = "recAvatarFloatPopover";
              floatPop.className = "oh-avatar-float-popover";
              document.body.appendChild(floatPop);
          }
          var hideTimer = null;

          function showFor(stack) {
              clearTimeout(hideTimer);
              var src = stack.querySelector(".oh-avatar-stack__popover-content");
              if (!src) {
                  return;
              }
              floatPop.innerHTML = src.innerHTML;
              var rect = stack.getBoundingClientRect();
              var pw = 260;
              var left = rect.left;
              if (left + pw > window.innerWidth - 8) {
                  left = window.innerWidth - pw - 8;
              }
              var top = rect.bottom + 6;
              if (top + 220 > window.innerHeight - 8) {
                  top = rect.top - 226;
              }
              floatPop.style.left = left + "px";
              floatPop.style.top = top + "px";
              floatPop.style.display = "block";
          }

          function scheduleHide() {
              hideTimer = setTimeout(function () {
                  floatPop.style.display = "none";
              }, 150);
          }

          document.addEventListener("mouseover", function (e) {
              var stack = e.target.closest && e.target.closest(".oh-avatar-stack");
              if (stack) {
                  showFor(stack);
              }
          });
          document.addEventListener("mouseout", function (e) {
              var stack = e.target.closest && e.target.closest(".oh-avatar-stack");
              var toStack = e.relatedTarget && e.relatedTarget.closest
                  ? e.relatedTarget.closest(".oh-avatar-stack")
                  : null;
              if (stack && stack !== toStack) {
                  scheduleHide();
              }
          });
          floatPop.addEventListener("mouseenter", function () {
              clearTimeout(hideTimer);
          });
          floatPop.addEventListener("mouseleave", scheduleHide);
      })();
</script>
