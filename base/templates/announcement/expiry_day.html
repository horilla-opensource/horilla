{% load i18n %}

{% for setting in announcement_expire_settings %}
    <form
        class="settings-label mb-1"
        hx-post="{% url 'update-announcement-expire-days' %}"
        hx-swap="none"
        hx-on-htmx-after-request="setTimeout(() => { reloadMessage(); }, 100);"
    >
        {% csrf_token %}
        <input type="hidden" name="setting_id" value="{{ setting.id }}">
        <div class="oh-inner-sidebar-content__header mt-4">
            <h2 class="oh-inner-sidebar-content__title">
                {% trans "Announcement Expire" %}
                {% if show_expire_company %}
                    <span class="text-xs text-gray-400">({{ setting.company_col }})</span>
                {% endif %}
            </h2>
        </div>
        <div>
            <div class="oh-label__info" for="defatul_expire">
                <label class="oh-label" for="defatul_expire">{% trans "Default Expire Days" %}</label>
                <span class="oh-info mr-2" title="{% trans 'Set default announcement expire days' %}" data-doc-url="{{ DOC_BASE_URL }}/blogs/complete-guide-to-company-information-settings-in-horilla-crm/"> </span>
            </div>
            <input
                type="number"
                name="days"
                value="{{ setting.days }}"
                class="oh-input w-25"
                placeholder="{% trans 'Days' %}"
                id="id_days_{{ setting.id }}"
            >
            {% if perms.base.change_announcementexpire %}
                <button
                    style="display: inline; margin-left: 10px"
                    type="submit"
                    class="oh-btn oh-btn--secondary mt-2 mr-0 oh-btn--w-100-resp"
                >
                    {% trans "Save Changes" %}
                </button>
            {% endif %}
        </div>

        <div class="oh-inner-sidebar-content__footer"></div>
    </form>
{% endfor %}
