{% load i18n %} {% load basefilters %}

<div class="oh-modal__dialog-header">
  <h2 class="oh-modal__dialog-title" id="shiftRequestsExportLavel">
    {% trans "Export Shift Requests" %}
  </h2>
  <button class="oh-modal__close" aria-label="{% trans 'Close' %}">
    <ion-icon name="close-outline"></ion-icon>
  </button>
</div>
<div
  class="oh-modal__dialog-body"
  id="shiftRequestsExportModalBody"
>
  <form
    action="{%url 'shift-request-info-export' %}"
    method="get"
    onsubmit="event.stopPropagation();
      var shiftIds = $('#shiftselectedInstances').attr('data-ids') || '[]';
      var allocatedIds = $('#allocatedselectedInstances').attr('data-ids') || '[]';
      var selectedIds = JSON.parse(shiftIds).length ? shiftIds : allocatedIds;
      $(this).find('[name=instance_ids]').val(selectedIds);
      $(this).parents().find('.oh-modal--show').last().toggleClass('oh-modal--show');"
    id="shiftRequestsExportForm"
  >
    {% csrf_token %}
    <input type="hidden" name="instance_ids">
    {% if not hide_export_filters %}
      {% include "shift_request/shift_request_export.html" %}
    {% endif %}
    <div class="oh-dropdown__filter-footer">
      <button class="oh-btn oh-btn--secondary oh-btn--small w-100">
        {% trans "Export" %}
      </button>
    </div>
  </form>
</div>
