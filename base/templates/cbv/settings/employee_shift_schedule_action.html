{% load i18n %}
<div class="flex items-center justify-center gap-1" onclick="event.stopPropagation();">
    {% if perms.base.change_employeeshiftschedule %}
        <a data-toggle="oh-modal-toggle" data-target="#genericModal"
            hx-get="{% url 'settings-employee-shift-shedule-update' instance.id %}" hx-target="#genericModalBody"
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm" title="{% trans 'Edit' %}">
            <ion-icon name="create-outline" role="img" class="md hydrated" aria-label="{% trans 'create outline' %}"></ion-icon>
        </a>
    {% endif %}
    {% if perms.base.delete_employeeshiftschedule %}
        <a class="oh-btn oh-btn--danger oh-btn--sq-sm"
            title="{% trans 'Delete' %}"
            hx-confirm="{% trans 'Are you sure you want to delete this schedule?' %}"
            hx-post="{% url 'employee-shift-schedule-delete' instance.id %}" hx-target="#scheduleTr{{instance.id}}"
            hx-swap="outerHTML">
            <ion-icon name="trash-outline" role="img" class="md hydrated" aria-label="{% trans 'trash outline' %}"></ion-icon>
        </a>
    {% endif %}
</div>
