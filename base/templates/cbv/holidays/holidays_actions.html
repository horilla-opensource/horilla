{% load i18n %}
<div onclick="event.stopPropagation()" class="flex items-center justify-center gap-1">
    {% if perms.base.change_holidays %}
        <button
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            title="{% trans 'Edit' %}"
            data-toggle="oh-modal-toggle"
            data-target="#genericModal"
            hx-get="{% url 'holiday-update' instance.id %}?{{pd}}&instance_ids={{instance.ordered_ids}}"
            hx-target="#genericModalBody"
        >
            <ion-icon name="create-outline"></ion-icon>
        </button>
        <button
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            title="{% trans 'Duplicate' %}"
            data-toggle="oh-modal-toggle"
            data-target="#genericModal"
            hx-get="{% url 'duplicate-holiday' instance.id %}?{{pd}}&instance_ids={{instance.ordered_ids}}"
            hx-target="#genericModalBody"
        >
            <ion-icon name="copy-outline"></ion-icon>
        </button>
    {% endif %}
    {% if perms.base.delete_holidays %}
        <button
            class="oh-btn oh-btn--danger oh-btn--sq-sm"
            id="delete-link"
            hx-confirm="{% trans 'Are you sure you want to delete?' %}"
            hx-post="{% url 'holiday-delete' instance.id %}"
            hx-target="#listContainer"
            title="{% trans 'Delete' %}"
        >
            <ion-icon name="trash-outline"></ion-icon>
        </button>
    {% endif %}
</div>
