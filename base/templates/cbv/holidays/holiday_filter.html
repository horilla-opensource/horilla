{% load i18n %}
<div class="oh-dropdown__filter-body">
    <div class="oh-accordion{% if modern_filter %} oh-accordion--show{% endif %}">
      <div class="oh-accordion-header">
        <span class="oh-filter-section-icon"><ion-icon name="calendar-outline"></ion-icon></span>
        {% trans "Holiday" %}
      </div>
      <div class="oh-accordion-body">
        <div class="row">
          <div class="col-sm-12 col-md-12">
            <div class="oh-input-group">
              <label class="oh-label" for="{{ form.recurring.id_for_label }}">{% trans "Recurring" %}</label>
                {{form.recurring}}
            </div>
          </div>
          <div class="col-sm-12 col-md-12">
            <div class="oh-input-group">
              <label class="oh-label" for="{{ form.available_for_all.id_for_label }}">{% trans "Available for all" %}</label>
                {{form.available_for_all}}
            </div>
          </div>
          <div class="col-sm-12 col-md-12 col-lg-6">
            <div class="oh-input-group">
              <label class="oh-label" for="{{ form.from_date.id_for_label }}">{% trans "From Date" %}</label>
              {{form.from_date}}
            </div>
          </div>
          <div class="col-sm-12 col-md-12 col-lg-6">
            <div class="oh-input-group">
              <label class="oh-label" for="{{ form.to_date.id_for_label }}">{% trans "To Date" %}</label>
              {{form.to_date}}
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="oh-accordion{% if modern_filter %} oh-accordion--show{% endif %}">
      <div class="oh-accordion-header"
        onclick="event.stopImmediatePropagation();$(this).parent().toggleClass('oh-accordion--show');"
      >
        <span class="oh-filter-section-icon"><ion-icon name="options-outline"></ion-icon></span>
        {% trans "Advanced" %}
      </div>
      <div class="oh-accordion-body">
        <div class="row">
          <!-- From/To Date range inputs live in the Holiday section -->
          <div class="col-sm-12 col-md-12 col-lg-12">
            <div class="oh-input-group">
              <div id="customFilterRowsContainer-holiday" class="oh-custom-filter-rows"></div>
              <button
                type="button"
                class="oh-custom-filter-add"
                onclick="addCustomFilterRow('holiday')"
              >+ {% trans "Add filter" %}</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{{ custom_filter_fields|json_script:"customFilterFields-holiday" }}
{{ custom_filter_rows|json_script:"customFilterRows-holiday" }}
<script>
    initCustomFilterBuilder('holiday');
</script>
