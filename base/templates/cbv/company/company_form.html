{% load i18n static %}

<template id="companyIconTemplate">
    <div class="row mb-3">
        <div class="col-12 d-flex align-items-center">
            <div
                class="oh-profile-section__edit-photo me-4 mb-3"
                data-toggle="oh-modal-toggle"
                data-target="#companyIconModal"
                style="border: 1px solid hsl(213, 22%, 84%)"
            >
                <img
                    src="{% if form.instance.icon %}{{ form.instance.icon.url }}{% else %}{% static 'images/ui/auth-logo.png' %}{% endif %}"
                    class="oh-profile-section__avatar preview"
                    alt="{% trans 'Company logo' %}"
                >
            </div>
        </div>
    </div>
</template>

<div class="oh-modal" id="companyIconModal" role="dialog" aria-labelledby="companyIconModal" aria-hidden="true">
    <div class="oh-modal__dialog">
        <div class="oh-modal__dialog-header">
            <span class="oh-modal__dialog-title" id="companyIconModalLabel">{% trans "Upload Logo" %}</span>
            <button
                type="button"
                class="oh-modal__close"
                aria-label="{% trans 'Close' %}"
                onclick="event.stopImmediatePropagation(); $('#companyIconModal').removeClass('oh-modal--show');"
            >
                <ion-icon name="close-outline"></ion-icon>
            </button>
        </div>
        <div class="oh-modal__dialog-body">
            <div class="oh-profile-section__image-container" id="companyIconFieldContainer">
                <div class="oh-profile-section__modal-avatar" style="border: 1px solid hsl(213, 22%, 84%)">
                    <img
                        src="{% if form.instance.icon %}{{ form.instance.icon.url }}{% else %}{% static 'images/ui/auth-logo.png' %}{% endif %}"
                        class="oh-profile-section__modal-image preview"
                        alt="{% trans 'Company logo' %}"
                    >
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    #id_icon_parent_div {
        display: none !important;
    }
</style>

{% include "generic/horilla_form.html" %}

<script>
    (function () {
        function initCompanyIconField() {
            var iconInput = document.getElementById("id_icon");
            var fieldContainer = document.getElementById("companyIconFieldContainer");
            var modal = document.getElementById("companyIconModal");
            var template = document.getElementById("companyIconTemplate");
            if (!iconInput || !fieldContainer || !modal || !template) {
                return;
            }

            var formEl = iconInput.closest("form");
            var card = formEl ? formEl.querySelector(".oh-profile-section__card") : null;
            if (card && !card.querySelector(".oh-profile-section__edit-photo")) {
                card.insertBefore(template.content.cloneNode(true), card.firstChild);
            }
            var originalParentDiv = document.getElementById("id_icon_parent_div");
            var errorList = originalParentDiv ? originalParentDiv.querySelector(".errorlist") : null;

            if (iconInput.parentElement !== fieldContainer) {
                fieldContainer.appendChild(iconInput);
                // The field now lives outside <form> in the DOM (inside the popup),
                // so associate it back to the form explicitly to keep it submitting.
                if (formEl && formEl.id) {
                    iconInput.setAttribute("form", formEl.id);
                }
            }
            iconInput.classList.add("oh-input", "oh-input--file", "oh-input--file-sm", "mt-4");
            // Browsers silently refuse to submit a required field that sits inside a
            // display:none ancestor (the closed popup) with no visible error at all.
            // Server-side validation (clean_icon / required=True) still runs on submit.
            iconInput.required = false;

            // A failed clean_icon() (bad extension/size) attaches its error to the
            // now-hidden original field row. Move it into the popup and reopen it
            // so the user can actually see why the upload was rejected.
            if (errorList) {
                fieldContainer.appendChild(errorList);
                modal.classList.add("oh-modal--show");
            }

            iconInput.addEventListener("change", function () {
                var file = this.files[0];
                if (!file) {
                    return;
                }
                var reader = new FileReader();
                reader.addEventListener("load", function () {
                    document.querySelectorAll(".preview").forEach(function (img) {
                        img.src = reader.result;
                    });
                });
                reader.readAsDataURL(file);
            });
        }
        initCompanyIconField();
    })();
</script>
