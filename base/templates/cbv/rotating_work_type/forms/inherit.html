{% load i18n %}
<div>
    {% include "generic/horilla_form.html" %}
</div>
<div id="moreWorkTypeContainer_{{form.work_type_counts}}" class="pt-2" style="text-align: end;">
<button
    hidden
      id="hidden"
      hx-target="#moreWorkTypeContainer_{{form.work_type_counts}}"
      hx-swap="outerHTML"
      hx-post="{% url 'add-remove-work-type-fields' %}"
      role="button"
      class="text-primary-600"
    >
      {% trans "Add more work types.." %}
    </button>
</div>


<script>

    $(document).ready(function() {
        // Field widths are driven server-side (RotatingWorkTypeForm.cols),
        // so every work_type field already renders full width here.
        var test = {{ form.work_type_counts }};

        var divElement = document.createElement('div');
        divElement.id = 'moreWorkTypeContainer_{{form.work_type_counts}}';
        divElement.className = 'pt-2 text-primary-600';
        divElement.style.textAlign = 'end';

        var anchorElement = document.createElement('a');
        anchorElement.setAttribute('role', 'button');
        anchorElement.setAttribute('id', 'link');
        anchorElement.innerText = 'Add more Work Types..';

        divElement.appendChild(anchorElement);

        var parentDivId = "id_work_type" + test + "_parent_div";
        var parentDiv = document.getElementById(parentDivId);
        if (!document.getElementById('link')) {
            if (parentDiv) {
                parentDiv.insertAdjacentElement('afterend', divElement);
            } else {
                var parentDiv = document.getElementById('id_work_type2_parent_div');
                parentDiv.insertAdjacentElement('afterend', divElement);
            }
        }

        $(document).off('click', '#link').on('click', '#link', function(e) {
            e.preventDefault();
            $('#hidden').trigger('click');
        });
    });

</script>
