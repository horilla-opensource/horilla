{% extends 'settings.html' %}
{% block settings %}
    {% load i18n %}

    <div class="mb-4">
        <h4 class="text-base font-semibold text-[#333]">{% trans "Default Export Access" %}</h4>
        <p class="text-xs text-gray-500 mt-1">
            {% trans "Control the default data export behavior for the currently selected company." %}
        </p>
    </div>

    <div class="border border-[#ebebeb] rounded-md overflow-hidden mb-5">
        <div class="p-4">
            <form id="enableExportAccessForm" hx-post="{% url 'enable-default-export-access' %}" hx-swap="none"
                hx-include="#enableExportAccess" hx-on-htmx-after-request="setTimeout(reloadMessage, 70);">
                {% csrf_token %}
                <div class="oh-label__info">
                    <label class="oh-label" for="enableExportAccess">
                        {% trans "Allow All Users to Export Data" %}
                    </label>
                    <span class="oh-info mr-2"
                        title="{% trans 'When enabled, every user of this company can export data from any module. When disabled, only users (or superusers) with the appropriate export permission for a module can export its data.' %}">
                    </span>
                </div>
                <div class="oh-switch p-3">
                    <input type="checkbox" class="oh-switch__checkbox" name="enable_export_access"
                        id="enableExportAccess" {% if enabled_export_access %} checked {% endif %} />
                </div>
            </form>
        </div>
    </div>

    <script>
        $(document).ready(function () {
            $('#enableExportAccess').on('change', function (e) {
                const $checkbox = $(this);
                const $form = $('#enableExportAccessForm');

                const message = $checkbox.is(':checked')
                    ? "{{ _('Are you sure you want to allow all users to export data?') }}"
                    : "{{ _('Are you sure you want to restrict data export to users with export permission?') }}";

                Swal.fire({
                    title: "{{ _('Please Confirm') }}",
                    text: message,
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: "{{ _('Confirm') }}",
                    cancelButtonText: "{{ _('Cancel') }}",
                    confirmButtonColor: '#008000',
                    cancelButtonColor: '#6c757d'
                }).then((result) => {
                    if (result.isConfirmed) {
                        const formData = new FormData($form[0]);
                        formData.append('csrfmiddlewaretoken', $('[name="csrfmiddlewaretoken"]').val());

                        $.ajax({
                            url: "{% url 'enable-default-export-access' %}",
                            type: 'POST',
                            headers: {
                                'HX-Request': 'true',
                                'X-CSRFToken': getCookie('csrftoken')
                            },
                            data: formData,
                            processData: false,
                            contentType: false,
                            success: function () {
                                reloadMessage();
                            },
                            error: function () {
                                Swal.fire("{{ _('Error') }}", "{{ _('Something went wrong while updating.') }}", "error");
                            }
                        });
                    } else {
                        $checkbox.prop('checked', !$checkbox.is(':checked'));
                    }
                });
            });
        });
    </script>
{% endblock settings %}
