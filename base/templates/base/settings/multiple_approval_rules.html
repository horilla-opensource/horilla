{% extends 'settings.html' %}
{% load i18n static %}

{% block settings %}
    <div id="ohMessages"></div>

    {% include "generic/components.html" %}

    <div class="mb-4">
        <h4 class="text-base font-semibold text-[#333]">{% trans "Multiple Approval Rules" %}</h4>
        <p class="text-xs text-gray-500 mt-1">
            {% trans "Configure department-based conditions and manager sequences for multi-level request approvals." %}
        </p>
    </div>

    <div class="border border-[#ebebeb] rounded-md mb-5">
        <div hx-get="{% url 'nav-multiple-approval-condition' %}" hx-trigger="load"></div>

        <div
            class="oh-checkpoint-badge mb-2"
            id="selectedInstances"
            data-ids="[]"
            data-clicked=""
            style="display: none"
        ></div>

        <div
            class="oh-wrapper"
            hx-get="{% url 'hx-multiple-approval-condition' %}?{{ request.GET.urlencode }}"
            hx-trigger="load"
            id="listContainer"
        >
            <div class="animated-background"></div>
        </div>
    </div>
{% endblock settings %}
