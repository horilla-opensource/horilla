{% load i18n %}

{% for setting in pagination_settings %}
    <form
        hx-post="{% url 'pagination-settings-view' %}"
        class="settings-label mb-1"
        hx-swap="none"
        hx-on-htmx-after-request="setTimeout(() => { reloadMessage(); }, 100);"
    >
        {% csrf_token %}
        <input type="hidden" name="setting_id" value="{{ setting.id }}">
        <div class="oh-inner-sidebar-content__header mt-4">
            <h2 class="oh-inner-sidebar-content__title">
                {% trans "Default Records Per Page" %}
                {% if show_pagination_company %}
                    <span class="text-xs text-gray-400">({{ setting.company_col }})</span>
                {% endif %}
            </h2>
        </div>
        <div class="oh-label__info" for="pagination">
            <label class="oh-label" for="pagination">{% trans "Pagination" %}</label>
            <span class="oh-info mr-2" title='{% trans "Default pagination for all views." %}'> </span>
        </div>
        <input
            type="number"
            name="pagination"
            value="{{ setting.pagination }}"
            class="oh-input w-25"
            placeholder="{% trans 'Pagination' %}"
            required=""
            id="id_pagination_{{ setting.id }}"
        >
        <button
            style="display: inline; margin-left: 10px"
            type="submit"
            class="oh-btn oh-btn--secondary mt-2 mr-0 oh-btn--w-100-resp"
        >
            {% trans "Save Changes" %}
        </button>
        <div class="oh-inner-sidebar-content__footer"></div>
    </form>
{% endfor %}
