{% load static i18n %}

<div class="oh-modal__dialog-header">
    <h2 class="oh-modal__dialog-title">{% trans "Import Roster" %}</h2>
    <button class="oh-modal__close" aria-label="{% trans 'Close' %}">
        <ion-icon name="close-outline"></ion-icon>
    </button>

    <div class="oh-modal__dialog-body p-0 pb-4">
        <form
            hx-post="{% url 'roster-import' %}"
            hx-target="#genericModalBody"
            hx-swap="innerHTML"
            hx-encoding="multipart/form-data"
            class="oh-profile-section"
        >
            {% csrf_token %}

            <div class="oh-modal__dialog-body mr-5" id="rosterUploading" style="display: none">
                <div class="loader-container">
                    <div class="loader"></div>
                    <div class="loader-text">{% trans "Uploading..." %}</div>
                </div>
            </div>

            <div id="error-container" style="color: red"></div>

            <div class="modal-body">
                <div class="oh-dropdown__import-form">
                    {% if error %}
                        <ul class="errorlist"><li>{{ error }}</li></ul>
                    {% endif %}
                    <label class="oh-dropdown__import-label">
                        <ion-icon
                            name="cloud-upload"
                            class="oh-dropdown__import-form-icon md hydrated"
                            role="img"
                            aria-label="{% trans 'cloud upload' %}"
                        ></ion-icon>
                        <span class="oh-dropdown__import-form-title">{% trans "Upload a File" %}</span>
                        <span class="oh-dropdown__import-form-text">{% trans "Drag and drop files here" %}</span>
                    </label>
                    <input type="file" name="file" required style="margin-bottom: 0">
                    <div class="d-inline float-end mb-2">
                        <a
                            href="#"
                            class="oh-dropdown__link"
                            style="text-decoration: none; display: inline-block"
                            onclick="rosterAskDownload(); return false"
                        >
                            <ion-icon
                                name="cloud-download-outline"
                                style="font-size: 20px; vertical-align: middle"
                            ></ion-icon>
                            <span>{% trans "Download Template" %}</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="modal-footer d-flex flex-row-reverse mt-6 w-100">
                <input type="submit" class="oh-btn oh-btn--small oh-btn--secondary w-100" value="{% trans 'Upload' %}">
            </div>
        </form>
    </div>
</div>

<script>
    var _rosterDefaultStart = '{{ default_start }}';
    var _rosterDefaultEnd   = '{{ default_end }}';

function rosterAskDownload() {
  Swal.fire({
    title: '{% trans "Download Roster Template" %}',
    html:
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;">' +
        '<div>' +
          '<label style="font-size:12px;font-weight:600;color:#4a5173;display:block;margin-bottom:4px;">{% trans "Start Date" %}</label>' +
          '<input type="date" id="swal_start" value="' + _rosterDefaultStart + '"' +
            ' style="width:100%;height:38px;padding:6px 10px;border:1px solid #d6dae8;border-radius:6px;font-size:13px;color:#333;outline:none;box-sizing:border-box;">' +
        '</div>' +
        '<div>' +
          '<label style="font-size:12px;font-weight:600;color:#4a5173;display:block;margin-bottom:4px;">{% trans "End Date" %}</label>' +
          '<input type="date" id="swal_end" value="' + _rosterDefaultEnd + '"' +
            ' style="width:100%;height:38px;padding:6px 10px;border:1px solid #d6dae8;border-radius:6px;font-size:13px;color:#333;outline:none;box-sizing:border-box;">' +
        '</div>' +
      '</div>',
    icon: 'info',
    showCancelButton: true,
    confirmButtonText: '<ion-icon name="cloud-download-outline" style="vertical-align:middle;margin-right:4px;"></ion-icon> {% trans "Download" %}',
    cancelButtonText: '{% trans "Cancel" %}',
    confirmButtonColor: '#008000',
    cancelButtonColor: '#6c757d',
    preConfirm: function () {
      var start = document.getElementById('swal_start').value;
      var end   = document.getElementById('swal_end').value;
      if (!start || !end) {
        Swal.showValidationMessage('{% trans "Please select both dates." %}');
        return false;
      }
      if (end < start) {
        Swal.showValidationMessage('{% trans "End date cannot be before start date." %}');
        return false;
      }
      return { start: start, end: end };
    }
  }).then(function (result) {
    if (result.isConfirmed) {
      window.location.href =
        '{% url "roster-template-download" %}?start_date=' +
        result.value.start + '&end_date=' + result.value.end;
    }
  });
}

    rosterAskDownload();
</script>
