{% extends 'settings.html' %}
{% load i18n %}
{% block settings %}
    {% load static %}
    {% include "generic/components.html" %}
    <meta name="csrf-token" content="{{ csrf_token }}">

    <!-- ******************* HISTORY TAGS ******************* -->

    <div class="oh-inner-sidebar-content border border-[#ebebeb] rounded-md">
        {% if perms.horilla_audit.view_audittag %}
            {% if perms.horilla_audit.add_audittag %}
                <div hx-get='{% url "audit-tag-navbar" %}' hx-trigger="load"></div>
            {% endif %}
            <div
                class="oh-checkpoint-badge mb-2"
                id="selectedInstances"
                data-ids="[]"
                data-clicked=""
                style="display: none"
            >
            </div>
            <div class="oh-wrapper" id="listContainer">
                <div class="animated-background"></div>
            </div>
        {% endif %}
    </div>
    <script src="{% static 'cbv/deleteFunc.js' %}"></script>
{% endblock settings %}
