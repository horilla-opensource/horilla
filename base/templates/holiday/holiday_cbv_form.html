{% load generic_template_filters %}

<div id="{{ view_id }}"></div>
<form id="{{ view_id }}Form"
      hx-post="{{ request.path }}?{{ request.GET.urlencode }}"
      {% if request.META.HTTP_HX_TARGET %}hx-target="#{{ request.META.HTTP_HX_TARGET }}"{% endif %}
      hx-swap="{% if hx_target == 'this' %}outerHTML{% else %}innerHTML{% endif %}"
      hx-encoding="multipart/form-data"
      novalidate>
    {{ form.structured }}
</form>
