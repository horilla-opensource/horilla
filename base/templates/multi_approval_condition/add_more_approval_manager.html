{% load i18n %} {% if field_html %}
<div
  class="oh-input__group pt-2"
  id="{{ current_hx_target }}"
  style="display: flex; padding-right:0px;"
>
  {{field_html}}
  <a
    hx-get="{% url 'remove-approval-manager' %}"
    class="oh-btn oh-btn--danger"
    hx-target="#{{ current_hx_target }}"
    hx-swap="outerHTML"
    id="delete-link"
    title="{% trans 'Remove manager' %}"
  >
    <ion-icon name="trash-outline"></ion-icon>
  </a>
</div>
<div id="{{ next_hx_target }}" class="pt-2 d-flex justify-content-end">
  <a
    hx-target="#{{ next_hx_target }}"
    hx-swap="outerHTML"
    hx-get="{% url 'add-more-approval-managers' %}?managers_count={{ managers_count }}"
    role="button"
    class="oh-btn oh-btn--x-small oh-btn--success-outline"
    >
    <ion-icon name="add-outline" class="me-1"></ion-icon>
    {% trans "Add Manager" %}</a
  >
</div>
{% else %}
<div
  class="oh-input__group pt-3"
  id="{{ current_hx_target }}"
  style="display: flex"
>
  {{ form.multi_approval_manager }} {{ form.multi_approval_manager.errors }}
  <a
    hx-get="{% url 'remove-approval-manager' %}"
    class="oh-btn oh-btn--danger"
    hx-target="#{{ current_hx_target }}"
    hx-swap="outerHTML"
    id="delete-link"
    title="{% trans 'Remove manager' %}"
  >
    <ion-icon name="trash-outline"></ion-icon>
  </a>
</div>
<div id="{{ next_hx_target }}" class="pt-2 d-flex justify-content-end">
  <a
    hx-target="#{{ next_hx_target }}"
    hx-swap="outerHTML"
    hx-get="{% url 'add-more-approval-managers' %}"
    role="button"
    class="oh-btn oh-btn--x-small oh-btn--success-outline"
    >
    <ion-icon name="add-outline" class="me-1"></ion-icon>
    {% trans "Add Manager" %}</a
  >
</div>
{% endif %}
