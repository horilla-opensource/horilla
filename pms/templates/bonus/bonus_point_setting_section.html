{% extends 'settings.html' %}
{% load i18n static %}

{% block settings %}
    <div id="ohMessages"></div>

    {% include "generic/components.html" %}

    <div class="mb-4">
        <h4 class="text-base font-semibold text-[#333]">{% trans "Bonus Point Settings" %}</h4>
        <p class="text-xs text-gray-500 mt-1">
            {% trans "Configure rules that automatically award bonus points to employees based on model events and conditions." %}
        </p>
    </div>

    <div class="border border-[#ebebeb] rounded-md mb-5">
        <div hx-get="{% url 'bonus-point-setting-nav' %}" hx-trigger="load"></div>

        <div
            class="oh-checkpoint-badge mb-2"
            id="selectedInstances"
            data-ids="[]"
            data-clicked=""
            style="display: none"
        >
        </div>

        <div
            class="oh-wrapper"
            hx-get="{% url 'bonus-point-setting-list-view' %}?{{ request.GET.urlencode }}"
            hx-trigger="load"
            id="listContainer"
        >
            <div class="animated-background"></div>
        </div>
    </div>

    <script>
        function ModelChange(element) {
            var model = element.val();
            $.ajax({
                url: "bonus-setting-form-values",
                data: { model: model },
                type: "GET",
                dataType: "json",
                success: function (response) {},
                error: function (xhr, status, error) {
                    console.error("Error:", error);
                },
            });
        }
    </script>
{% endblock settings %}
