{% load i18n %}
<div onclick="event.stopPropagation()" class="flex items-center justify-center gap-1">
    {% if perms.pms.change_bonuspointsetting %}
        <button
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            title="{% trans 'Edit' %}"
            data-toggle="oh-modal-toggle"
            data-target="#genericModal"
            hx-get="{% url 'update-bonus-point-setting' instance.id %}?{{pd}}&instance_ids={{instance.ordered_ids}}"
            hx-target="#genericModalBody"
        >
            <ion-icon name="create-outline"></ion-icon>
        </button>
    {% endif %}
    {% if perms.pms.delete_bonuspointsetting %}
        <button
            class="oh-btn oh-btn--danger oh-btn--sq-sm"
            id="delete-link"
            hx-confirm="{% trans 'Do you want to delete the bonus point setting?' %}"
            hx-post="{% url 'delete-bonus-point-setting' instance.id %}"
            hx-target="#bonusPointSettingListContainer"
            title="{% trans 'Delete' %}"
        >
            <ion-icon name="trash-outline"></ion-icon>
        </button>
    {% endif %}
</div>
