{% load i18n %}

{% if request.user.id|stringformat:"d" == instance.anonymous_feedback_id  or request.user.is_superuser %}
    <div class="flex items-center justify-center gap-1" onclick="event.stopPropagation()">
        <button
            type="button"
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            data-toggle="oh-modal-toggle"
            data-target="#genericModal"
            hx-get="{% url 'edit-anonymous-feedback' instance.id %}?instance_ids={{instance.ordered_ids}}"
            title="{% trans 'Edit' %}"
            hx-target="#genericModalBody"
        >
            <ion-icon name="create-outline"></ion-icon>
        </button>
        <form
            action="{% url 'archive-anonymous-feedback' obj_id=instance.id %}"
            method="post"
            onsubmit="return confirm('{% if instance.archive %}{% trans "Are you sure you want to Un-archive this feedback?" %}{% else %}{% trans "Are you sure you want to archive this feedback?" %}{% endif %}')"
            style="display: contents"
        >
            {% csrf_token %}
            <button
                class="oh-btn oh-btn--danger oh-btn--sq-sm"
                title="{% if instance.archive == True %}{% trans 'Un-archive' %}{% else %}{% trans 'Archive' %}{% endif %}"
                type="submit"
            >
                <ion-icon name="archive-sharp"></ion-icon>
            </button>
        </form>
        <form
            action="{% url 'delete-anonymous-feedback' obj_id=instance.id %}"
            method="post"
            onsubmit="return confirm('{% trans "Do you want Delete this Feedback ?" %}')"
            style="display: contents"
        >
            {% csrf_token %}
            <button class="oh-btn oh-btn--danger oh-btn--sq-sm" title="{% trans 'Delete' %}" type="submit">
                <ion-icon name="trash-outline" role="img" class="md hydrated" aria-label="{% trans 'trash outline' %}"></ion-icon>
            </button>
        </form>
    </div>
{% endif %}
