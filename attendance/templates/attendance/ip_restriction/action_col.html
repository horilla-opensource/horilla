{% load i18n %}
<div class="oh-btn-group">
	<a
		hx-get="{% url 'edit-allowed-ip' %}?id={{instance.pk}}"
		hx-target="#objectDetailsModalW25Target"
		data-toggle="oh-modal-toggle"
		data-target="#objectDetailsModalW25"
		type="button"
		class="oh-btn oh-btn--light-bkg w-50"
		title="{% trans 'Edit' %}"
	>
		<ion-icon
			name="create-outline"
			role="img"
			class="md hydrated"
			aria-label="{% trans 'create outline' %}"
		></ion-icon
	></a>
	<form
		action="{% url 'delete-allowed-ip' %}?id={{instance.pk}}"
		class="w-50"
		onsubmit="return confirm('{% trans "Are you sure you want to delete this IP ?" %}');"
		method="post"
	>
		{% csrf_token %}
		<button
			type="submit"
			class="oh-btn oh-btn--danger w-100"
			title="{% trans 'Remove' %}"
		>
			<ion-icon
				name="trash-outline"
				role="img"
				class="md hydrated"
				aria-label="{% trans 'trash outline' %}"
			></ion-icon>
		</button>
	</form>
</div>
<script>
	function confirmDeleteAllowedIp(btn) {
		var form = btn.closest("form");
		Swal.fire({
			{% comment %} title: "{% trans 'Are you sure?' %}", {% endcomment %}
			text: "{% trans 'Are you sure you want to delete this IP ?' %}",
			icon: "warning",
			showCancelButton: true,
			confirmButtonColor: "#d33",
			cancelButtonColor: "#6c757d",
			confirmButtonText: "{% trans 'Delete' %}",
			cancelButtonText: "{% trans 'Cancel' %}",
		}).then(function (result) {
			if (result.isConfirmed) {
				if (form.requestSubmit) {
					form.requestSubmit();
				} else {
					form.submit();
				}
			}
		});
	}
</script>
