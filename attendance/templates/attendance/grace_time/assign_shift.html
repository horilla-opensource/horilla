{% load i18n %}
<div class="oh-modal__dialog-header">
    <h2 class="text-md font-semibold mb-3" id="ModalTitle">
        {% trans 'Assign Shifts' %}
    </h2>
    <button type="button" class="oh-modal__close" aria-label="{% trans 'Close' %}">
        <ion-icon name="close-outline"></ion-icon>
    </button>
</div>
<div class="oh-modal__dialog-body">
    <form
        hx-post='{% url "assign-shift" grace_time.id %}'
        hx-target="#objectUpdateModalTarget"
    >
        {{ form.as_p }}
    </form>
</div>

<script>
    $("#objectUpdateModalTarget").find('.col-md-6').removeClass('col-md-6')
</script>
