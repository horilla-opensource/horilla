<div class="oh-switch">
    {% if perms.attendance.change_gracetime %}
        <input
            type="checkbox"
            id="isAllowedClockOut"
            name="isChecked"
            class="oh-switch__checkbox"
            {% if instance.allowed_clock_out %}
                checked
            {% endif %}
            hx-post="{% url 'update-gracetime-clock-in-clock-out' %}"
            hx-trigger="change"
            hx-vals='{"gracetimeId": "{{instance.id}}", "update": "clock_out"}'
            hx-swap="none"
            hx-on-htmx-after-request="setTimeout(() => { reloadMessage(); }, 200);"
        >
    {% else %}
        <input
            type="checkbox"
            id="isAllowedClockOut"
            class="oh-switch__checkbox"
            {% if instance.allowed_clock_out %}
                checked
            {% endif %}
            disabled
        >
    {% endif %}
</div>
