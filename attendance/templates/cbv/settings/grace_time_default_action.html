{% load i18n %}

{% if perms.attendance.change_gracetime %}
    <div class="flex items-center justify-center gap-1">
        {% if perms.base.change_employeeshift %}
            <a
                hx-get='{% url "assign-shift" instance.id %}'
                hx-target="#objectUpdateModalTarget"
                type="button"
                data-toggle="oh-modal-toggle"
                data-target="#objectUpdateModal"
                type="button"
                class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
                title="{% trans 'Assign shift' %}"
            >
                <ion-icon name="alarm-outline"></ion-icon>
            </a>
        {% endif %}
        {% if perms.base.change_gracetime %}
            <a
                hx-get="{% url 'grace-time-update' instance.id %}?instance_ids={{instance.ordered_ids}}&default={% if instance.is_default %}True{% else %}False{% endif %}"
                hx-target="#genericModalBody"
                type="button"
                data-toggle="oh-modal-toggle"
                data-target="#genericModal"
                type="button"
                class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
                title="{% trans 'Edit' %}"
            >
                <ion-icon name="create-outline"></ion-icon>
            </a>
        {% endif %}
        {% if perms.base.delete_gracetime %}
            <button
                class="oh-btn oh-btn--danger oh-btn--sq-sm"
                title="{% trans 'Remove' %}"
                hx-get="{% url 'generic-delete' %}?model=attendance.gracetime&pk={{instance.pk}}"
                data-toggle="oh-modal-toggle"
                data-target="#deleteConfirmation"
                hx-target="#deleteConfirmationBody"
            >
                <ion-icon name="trash-outline" class="text-white"></ion-icon>
            </button>
        {% else %}
            <button
                type="submit"
                class="oh-btn oh-btn--danger oh-btn-disabled oh-btn--sq-sm"
                title="{% trans 'Delete' %}"
            >
                <ion-icon name="trash-outline "></ion-icon>
            </button>
        {% endif %}
    </div>
{% endif %}
