{% load i18n basefilters %}
{% is_manager_of request.user instance as can_manage %}
{% if perms.attendance.change_attendance or can_manage %}
    {% if instance.is_validate_request %}
        <a
            href="#"
            class="oh-btn oh-btn--info"
            onclick="event.preventDefault(); event.stopPropagation(); showApproveAlert($(this).data('req'))"
            data-req="/attendance/request-attendance-view/?id={{ instance.id }}"
        >
            {% trans "Validate" %}
        </a>
    {% else %}
        <button
            href="#"
            class="oh-btn oh-btn--info"
            onclick="event.preventDefault(); event.stopPropagation(); (function(pk){
                Swal.fire({
                    title: '{% trans 'Are you sure?' %}',
                    text: '{% trans 'Do you want to validate this attendance?' %}',
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonColor: '#008000',
                    cancelButtonColor: '#6c757d',
                    confirmButtonText: '{% trans 'Confirm' %}',
                    cancelButtonText: '{% trans 'Cancel' %}'
                }).then(function(result) {
                    if (result.isConfirmed) {
                        htmx.ajax('GET', '{% url 'validate-this-attendance' instance.id %}', {swap: 'none'});
                    }
                });
            })({{ instance.id }}); return false"
        >
            {% trans "Validate" %}
        </button>
    {% endif %}
{% endif %}
