# Smoke unit tests for the Horilla unit-test coverage program.
# Expand UNIT_LABELS as more apps gain real suites.

name: Unit Tests

on:
  push:
    branches: [dev/v2.0, feature/unit-test-coverage, v2_dev]
  pull_request:
    branches: [dev/v2.0, v2_dev]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries (Weasy/xhtml2pdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi8 shared-mime-info

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'coverage>=7.0'

      - name: Ensure local_settings stub exists
        run: |
          if [ ! -f horilla/settings/local_settings.py ]; then
            printf '%s\n' '# Ephemeral for CI' > horilla/settings/local_settings.py
          fi

      - name: Run smoke unit tests with coverage floor
        env:
          DJANGO_SETTINGS_MODULE: horilla.settings
          DEBUG: "True"
          SECRET_KEY: ci-dev-not-for-production
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: make test-cov COV_FAIL_UNDER=5
