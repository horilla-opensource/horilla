name: Deploy to AWS

on:
  push:
    branches: [dev/v2.0]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GH_PAT
          script: |
            set -e
            cd /srv/Horilla-HR-Index

            echo "==> Configuring git credentials..."
            echo "https://x-access-token:${GH_PAT}@github.com" > ~/.git-credentials-deploy
            git config credential.helper "store --file=$HOME/.git-credentials-deploy"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Cleaning up credentials..."
            rm -f ~/.git-credentials-deploy
            git config --unset credential.helper || true

            echo "==> Rebuilding and restarting containers..."
            docker compose build web
            docker compose up -d --force-recreate web

            echo "==> Running migrations..."
            docker compose exec -T web python manage.py migrate --noinput

            echo "==> Collecting static files..."
            docker compose exec -T web python manage.py collectstatic --noinput

            echo "==> Waiting for health check..."
            for i in $(seq 1 45); do
              if curl -sf --max-time 5 http://localhost:8000/health/ 2>/dev/null; then
                echo ""
                echo "==> Deploy successful! Horilla HR is healthy."
                exit 0
              fi
              sleep 2
            done

            echo "==> Health check failed. Showing logs:"
            docker compose logs --tail=50 web
            exit 1
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
