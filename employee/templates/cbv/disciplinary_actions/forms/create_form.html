<script>

    // These handlers used to live only in the standalone disciplinary-actions
    // page template, so on any other page hosting this form (e.g. the
    // Policies & Discipline tabs) the Action select's inline onchange threw
    // "actionTypeChange is not defined" -- the suspension period fields never
    // appeared and the select2 dropdown was left stuck open. Defining them
    // with the form fragment itself makes the form self-contained. They must
    // be defined BEFORE the include below: horilla_form.html's own inline
    // script fires a change event on the action select while the fragment is
    // still being processed, which reaches the inline onchange immediately.
    function actionTypeChange(selectElement) {
        var selectedActiontype = selectElement.val();
        var parentForm = selectElement.parents().closest("form");
        if (selectedActiontype !== "create" && selectedActiontype && selectedActiontype !== "dynamic_create") {
            $.ajax({
                type: "post",
                url: "{% url 'action-type-details' %}",
                data: {
                    csrfmiddlewaretoken: getCookie("csrftoken"),
                    action_type: selectedActiontype,
                },
                success: function (response) {
                    // Check if the response.action_type is "suspension"
                    $("[id=id_unit_in]").change(function (e) {
                        e.preventDefault();
                        if (this.value == "days") {
                            parentForm.find("[id=id_days]").parent().parent().show();
                            parentForm.find("[id=id_hours]").parent().parent().hide();
                            parentForm.find("[name=days]").prop("required", true);
                        } else {
                            parentForm.find("[id=id_hours]").parent().parent().show();
                            parentForm.find("[id=id_days]").parent().parent().hide();
                            parentForm.find("[name=days]").prop("required", false);
                        }
                    });
                    if (response.action_type === "suspension") {
                        // Show the 'days' field
                        parentForm.find("[id=id_unit_in]").parent().parent().show();
                        parentForm.find("[id=id_hours]").parent().parent().show();
                        $("[id=id_unit_in]").change();
                    } else {
                        // Hide the 'days' field
                        $("[id=id_unit_in]").change();
                        parentForm.find("[id=id_days]").parent().parent().hide();
                        parentForm.find("[id=id_unit_in]").parent().parent().hide();
                        parentForm.find("[id=id_hours]").parent().parent().hide();
                        parentForm.find("[name=days]").prop("required", false);
                    }
                },
            });
        }
    }

    function actionChange(selectElement) {
        var selectedActiontype = selectElement.val();
        var parentForm = selectElement.parents().closest("form");
        $.ajax({
            type: "post",
            url: "{% url 'action-type-name' %}",
            data: {
                csrfmiddlewaretoken: getCookie("csrftoken"),
                "action_type": selectedActiontype,
            },
            success: function (response) {

                // Check if the response.action_type is "warning"
                if (response.action_type === "warning") {
                    // Hide the 'block_option' field
                    parentForm.find('[id=id_block_option_parent_div]').hide();
                } else {
                    // Show the 'block_option' field
                    parentForm.find('[id=id_block_option_parent_div]').show();
                }

            },
        });
    }

    // Sync the period fields (Unit in / Days / Hours) with the currently
    // selected action: show them (via actionTypeChange) for a selected
    // action, hide them when nothing is selected yet.
    function syncDisciplinaryPeriodFields() {
        var actionElement = $("#id_action");
        if (actionElement.length === 0) {
            return;
        }
        var action = actionElement.val();
        if (action && action !== "dynamic_create") {
            actionTypeChange(actionElement);
        } else {
            $("#id_days").parent().parent().hide();
            $("#id_unit_in").parent().parent().hide();
            $("#id_hours").parent().parent().hide();
            $("[name=days]").prop("required", false);
        }
    }
</script>

<div id="formContainer">
    {% include "generic/horilla_form.html" %}
</div>

<script>
    // The initial hide must ALSO run on htmx:afterSettle, not only right
    // here: when this form is reopened in a modal whose previous copy was
    // only hidden (not removed), htmx id-matches the new elements to the old
    // ones and its settle phase restores their attributes -- wiping any
    // inline display:none set between swap and settle. Hiding again after
    // settle is what actually sticks on reopen.
    // Namespaced + off() first, so reloading this fragment doesn't stack
    // duplicate document-level handlers.
    $(document).off("htmx:afterSettle.disciplinaryActionForm").on("htmx:afterSettle.disciplinaryActionForm", function () {
        syncDisciplinaryPeriodFields();
    });

    syncDisciplinaryPeriodFields();
</script>
