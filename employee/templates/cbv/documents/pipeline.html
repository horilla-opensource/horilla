{% load i18n generic_template_filters horillafilters %}

<div id="{{view_id}}" class="accordion-wrapper space-y-2">
  <button
      class="reload-record"
      hidden
      hx-get="{{groups_search_url|default:request.path}}?{{request.GET.urlencode}}"
      hx-target="#{{view_id}}"
      hx-swap="outerHTML"
  ></button>

  {% include "generic/filter_tags.html" %}
  {% include "generic/quick_actions.html" %}

  {% if not groups %}
  <div class="oh-wrapper h-full" align="center">
    <div class="xl:col-span-4 md:col-span-6 col-span-12 bg-white p-6 rounded-md shadow-card h-[70%]">
      <div class="flex flex-col items-center justify-center h-full">
        <img src="/static/horilla_theme/assets/img/no-records.svg" alt="" width="300" class="mb-4">
        <p class="text-[#666] mb-5">{% trans "No records available at the moment" %}</p>
      </div>
    </div>
  </div>
  {% endif %}
  {% for group in groups %}
  <div id="{{selected_instances_key_name}}{{ group.id }}" data-ids="[]"></div>
  <div class="accordion-item border border-primary-300 rounded-md overflow-hidden">
    <button
      class="accordion-btn w-full flex justify-between items-center px-4 py-2 text-sm transition-all bg-primary-100 text-primary-600"
      data-group-id="{{ group.id }}"
      hx-get="{{url}}?{% for parameter in parameters %}{{parameter|format:group}}&{% endfor %}{{request.GET.urlencode}}"
      hx-target="#docRequest{{ group.id }}"
      hx-trigger="doRequest"
      _="on click if isElementVisible(me) trigger doRequest"
      hx-on:click="toggleDocAccordion(this); rememberDocGroupOpenState(this);"
    >
      <div class="flex items-center gap-2">
        <span
          class="w-6 h-6 bg-primary-600 rounded-full text-white flex items-center justify-center text-xs"
          title="{{ group.filtered_document_count }} {% trans 'Documents' %}"
        >
          {{ group.filtered_document_count }}
        </span>
        {{ group }}
      </div>
      <div class="flex items-center gap-5">
        <ion-icon class="icon text-lg" name="chevron-down-outline"></ion-icon>
        <span onclick="event.stopPropagation()">
          <div class="inline-block dropdown-wrapper text-md">
            <a class="cursor-pointer dropdown-toggle block w-4" title="{% trans 'Actions' %}">
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </a>
            <!-- Dropdown Content -->
            <div class="dropdown-menu absolute right-[85px] min-w-[100px] bg-white rounded-lg shadow-card py-2 hidden z-50 transition-all duration-200">
              <ul class="text-xs">
                {% for action in actions %}
                  {% if action.accessibility|accessibility:group %}
                    <li>
                      <a
                        class="w-full flex text-left px-3 py-1 text-dark-600 hover:text-primary-600 transition duration-300"
                        {{action.attrs|format:group|safe}}
                      >
                        {{action.action}}
                      </a>
                    </li>
                  {% endif %}
                {% endfor %}
              </ul>
            </div>
          </div>
        </span>
      </div>
    </button>
    <div
      class="accordion-panel max-h-0 overflow-hidden transition-all duration-300 bg-white px-4 pt-3 text-sm text-gray-700"
      id="docRequest{{ group.id }}"
      style="max-height: 0px"
    >
    </div>
  </div>
  {% endfor %}
</div>

<script>
    $(document).ready(function () {
        reloadMessage();
    });

    function isElementVisible(element) {
        const $targetSelector = $(element).attr("hx-target");
        const $targetEl = $($targetSelector);
        const isOpen = $targetEl.css("max-height") && $targetEl.css("max-height") !== "0px";
        return !isOpen;
    }

    // Unlike the shared toggleAccordion() (which closes every other group -
    // fine for a single asset category list, but here it meant opening a
    // second document type yanked the first one shut), this only ever
    // touches the clicked group's own panel so multiple groups can stay open
    // at once.
    function toggleDocAccordion(btn) {
        var panel = btn.nextElementSibling;
        var icon = btn.querySelector(".icon");
        var isOpen = panel.style.maxHeight && panel.style.maxHeight !== "0px";
        if (!isOpen) {
            panel.style.maxHeight = panel.scrollHeight + "px";
            if (icon) icon.setAttribute("name", "chevron-up-outline");
        } else {
            panel.style.maxHeight = null;
            if (icon) icon.setAttribute("name", "chevron-down-outline");
        }
    }

    // toggleDocAccordion() measures scrollHeight synchronously on click, but
    // the panel's actual content (the document table, or the "no records"
    // card) only arrives afterwards via the accordion button's own hx-get -
    // so the max-height it sets is measured against the still-empty panel
    // and never updated once real content lands, clipping everything past
    // that near-zero height. Re-measure once htmx swaps the content in.
    document.addEventListener("htmx:afterSwap", function (e) {
        var panel = e.target;
        if (!panel.id || panel.id.indexOf("docRequest") !== 0) return;
        if (!panel.style.maxHeight || panel.style.maxHeight === "0px") return;
        panel.style.maxHeight = panel.scrollHeight + "px";
        // The "no records" illustration can still be mid-download at swap
        // time, growing the panel further once it finishes loading in.
        panel.querySelectorAll("img").forEach(function (img) {
            if (img.complete) return;
            img.addEventListener(
                "load",
                function () {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                },
                { once: true }
            );
        });
    });

    // Approving/rejecting/uploading a document reloads this entire list from
    // the server (see htmx_refresh_document_request_container), which
    // re-renders every group collapsed - closing whichever ones the user had
    // open. Remember the open set (per browser tab) and re-expand them once
    // this fragment re-renders, so acting on a document doesn't kick the
    // user back out of its group(s).
    (function () {
        var STORAGE_KEY = "docRequestOpenGroups";

        function getOpenGroups() {
            try {
                return JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "[]");
            } catch (e) {
                return [];
            }
        }

        window.rememberDocGroupOpenState = function (btn) {
            // toggleDocAccordion() has already run by the time this fires
            // (see the hx-on:click order below) and sets the chevron icon
            // synchronously - unlike panel.style.maxHeight, which it grows
            // from the panel's current (possibly still-empty, still "0px")
            // scrollHeight until the async htmx content lands, so checking
            // maxHeight here raced against that and always read "closed".
            var icon = btn.querySelector(".icon");
            var isOpen = !!icon && icon.getAttribute("name") === "chevron-up-outline";
            var groupId = btn.getAttribute("data-group-id");
            var open = getOpenGroups();
            var idx = open.indexOf(groupId);
            if (isOpen && idx === -1) {
                open.push(groupId);
            } else if (!isOpen && idx !== -1) {
                open.splice(idx, 1);
            }
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify(open));
        };

        // No stored state at all means this is the first time this list has
        // rendered in this tab (as opposed to the user having deliberately
        // collapsed every group, which is also a valid empty [] state) -
        // default to the first group open rather than everything collapsed.
        var isFirstLoad = sessionStorage.getItem(STORAGE_KEY) === null;
        var groupsToOpen = getOpenGroups();
        if (isFirstLoad) {
            var firstBtn = document.querySelector('#{{view_id}} .accordion-btn');
            if (firstBtn) {
                groupsToOpen = [firstBtn.getAttribute("data-group-id")];
                sessionStorage.setItem(STORAGE_KEY, JSON.stringify(groupsToOpen));
            }
        }

        groupsToOpen.forEach(function (savedGroupId) {
            // A real .click() here would race hyperscript's own click-binding
            // for this freshly-swapped-in button (it isn't necessarily bound
            // yet), so its "on click ... trigger doRequest" condition can
            // silently no-op and leave the panel empty. Drive both halves of
            // what a real click does explicitly instead: flip the open/closed
            // visuals via toggleDocAccordion(), and fire the "doRequest"
            // htmx trigger directly via htmx's own API rather than through
            // hyperscript at all.
            setTimeout(function () {
                var savedBtn = document.querySelector(
                    '#{{view_id}} .accordion-btn[data-group-id="' + savedGroupId + '"]'
                );
                if (savedBtn) {
                    toggleDocAccordion(savedBtn);
                    if (typeof htmx !== "undefined") {
                        htmx.trigger(savedBtn, "doRequest");
                    }
                }
            }, 150);
        });
    })();

    $(".dropdown-toggle").on("click", function () {
        const dropdownMenu = $(this).next(".dropdown-menu");
        const isOpen = dropdownMenu.is(":visible");

        $(".dropdown-menu").not(dropdownMenu).hide();

        if (isOpen) {
            dropdownMenu.hide();
        } else {
            dropdownMenu.show();
        }
    });

    var tabId = $("#{{view_id}}").closest(".oh-tabs__content").attr("id");
    var badge = $(`#badge-${tabId}`);
    var count = "{{groups_total_count}}";
    var label = badge.attr("data-badge-label") || "";
    var title = count + " " + label;
    badge.html(count);
    badge.attr("title", title);
</script>
