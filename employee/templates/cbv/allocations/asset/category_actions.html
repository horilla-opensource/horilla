{% load i18n %}
{% if instance.category_request_status == "Available" %}
<a style="font-size: 15px;color: darkseagreen;" title="{% trans 'Request Asset' %}" onclick="
$(this).closest('tr').find('td:first [type=checkbox]').prop('checked',!$(this).find('td:first [type=checkbox]').is(':checked')).change();
$('#addTypesButton').click();
" class="oh-btn oh-btn--danger w-100"><ion-icon name="checkmark-done-circle-outline"></ion-icon></a>
{% else %}
<span style="font-size: 15px;" title="{{ instance.category_request_status }}" class="oh-btn oh-btn--light-bkg w-100"><ion-icon name="time-outline"></ion-icon></span>
{% endif %}
