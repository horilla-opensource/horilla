{% load i18n %}
{% if instance.category_request_status == "Available" %}
<a title="{% trans 'Request Asset' %}" onclick="
$(this).closest('tr').find('td:first [type=checkbox]').prop('checked',!$(this).find('td:first [type=checkbox]').is(':checked')).change();
$('#addTypesButton').click();
" class="oh-btn oh-btn--success oh-btn--sq-sm"><ion-icon name="checkmark-done-circle-outline"></ion-icon></a>
{% else %}
<span title="{{ instance.category_request_status }}" class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"><ion-icon name="time-outline"></ion-icon></span>
{% endif %}
