{% load i18n %}
{% if not instance.include_active_employees or employee in instance.exclude_employees.all %}
  <a title="{% trans 'Allocate Allowance' %}" onclick="
  $(this).closest('tr').find('td:first [type=checkbox]').prop('checked',!$(this).find('td:first [type=checkbox]').is(':checked')).change();
  $('#addAllowanceButton').click();
  " class="oh-btn oh-btn--success oh-btn--sq-sm"><ion-icon name="checkmark-done-circle-outline"></ion-icon></a>
{% else %}
  <a title="{% trans 'Remove from allowance' %}" hx-post="{% url "allocation-allowance-list"%}?exclude=True" hx-vals='{"instance_id":"{{request.GET.instance_id}}","allowance_id":"{{instance.pk}}"}'  class="oh-btn oh-btn--danger oh-btn--sq-sm"><ion-icon name="close-circle-outline"></ion-icon></a>
{% endif %}
