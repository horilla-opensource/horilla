{% load i18n %}
{% if perms.leave.change_restrictleave or perms.leave.delete_restrictleave %}
    <div class="flex items-center justify-center gap-1">
        {% if perms.leave.change_restrictleave %}
            <button
                class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
                title="{% trans 'Edit' %}"
                data-toggle="oh-modal-toggle"
                data-target="#genericModal"
                hx-get="{% url 'restrict-update' instance.id %}?{{pd}}&instance_ids={{instance.ordered_ids}}"
                hx-target="#genericModalBody"
            >
                <ion-icon name="create-outline"></ion-icon>
            </button>
        {% endif %}
        {% if perms.leave.delete_restrictleave %}
            <button
                onclick="event.stopPropagation()"
                class="oh-btn oh-btn--danger oh-btn--sq-sm"
                id="delete-link"
                hx-confirm="{% trans 'Are you sure you want to delete?' %}"
                hx-post="{% url 'restrict-delete' instance.id %}?{{pd}}"
                hx-target="#restrictday"
                title="{% trans 'Delete' %}"
            >
                <ion-icon name="trash-outline"></ion-icon>
            </button>
        {% endif %}
    </div>
{% endif %}
