{% load i18n %}
<div class="" onclick="event.stopPropagation()">
    <div class="flex items-center justify-center gap-1">
        {% if perms.payroll.change_loanaccount or request.user %}
            <a class="oh-btn oh-btn--light-bkg oh-btn--sq-sm" hx-get="{% url 'loan-edit-form' instance.id %}?instance_ids={{instance.ordered_ids}}" hx-target="#genericModalBody" data-toggle="oh-modal-toggle" data-target="#genericModal" title='{% trans "Edit" %}'>
                <ion-icon class="text-dark" name="create-outline"></ion-icon></a>
        {% endif %}
        {% if perms.payroll.delete_loanaccount %}
            <a class="oh-btn oh-btn--danger oh-btn--sq-sm"
                href="#"
                hx-get="{% url 'delete-loan' %}?ids={{ instance.id }}"
                hx-confirm="{% trans 'Do you want to delete this record?' %}"
                hx-swap="none"
                onclick="event.preventDefault(); event.stopPropagation();"
                title='{% trans "Delete" %}'>
                <ion-icon name="trash-outline"></ion-icon></a>
        {% endif %}
    </div>
</div>
