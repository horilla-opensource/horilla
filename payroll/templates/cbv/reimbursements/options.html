{% load i18n %}
<div class="flex items-center justify-center gap-1">
    {% if perms.payroll.change_reimbursement or request.user == instance.employee_id.employee_user_id %}
        {% if instance.status == 'requested' %}
            <a
                onclick="event.stopPropagation()"
                hx-get="{% url 'reimbursement-update' instance.id %}"
                hx-target="#genericModalBody"
                data-toggle="oh-modal-toggle"
                data-target="#genericModal"
                class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
                title="{% trans 'Edit' %}"
            >
            <ion-icon name="create-outline"></ion-icon>
            </a>
        {% else %}
            <button
                class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
                disabled
            >
                <ion-icon name="create-outline"></ion-icon>
            </button>
        {% endif %}
    {% endif %}
    {% if perms.payroll.delete_reimbursement %}
        <a href="#"
            hx-get="{% url 'delete-reimbursement' %}?ids={{instance.id}}"
            hx-confirm="{% trans 'Do you want to delete this record?' %}"
            hx-swap="none"
            onclick="event.preventDefault();event.stopPropagation();"
            class='oh-btn oh-btn--danger oh-btn--sq-sm' title='{% trans "Delete" %}'>

            <ion-icon name="trash-outline"></ion-icon>
        </a>
    {% endif %}
</div>
