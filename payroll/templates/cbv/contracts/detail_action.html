{% load i18n %}
{% if  perms.payroll.delete_contract or perms.payroll.change_contract %}


                    {% if perms.payroll.change_contract  %}
                        <a href="#"
                            hx-get="{% url 'update-contract' instance.id %}"
                            hx-target="#listContainer"
                            hx-swap="innerHTML"
                            hx-on:click="$(this).closest('.oh-modal--show').removeClass('oh-modal--show');"
                            class="oh-btn-group oh-btn oh-btn--light-bkg oh-btn--secondary"
                            style="width: 50%;">
                            <ion-icon
                            name="create-outline"
                            role="img"
                            class="md hydrated"
                            aria-label="{% trans 'create outline' %}"
                            ></ion-icon>{% trans "Edit" %}
                        </a>
                    {% endif %}
                    {% if perms.payroll.delete_contract  %}
                        <a
                            class="oh-btn-group oh-btn oh-btn--danger"style="width: 50%;"
                            hx-confirm="{% trans 'Do you want to delete this Contract?' %}"
                            hx-post="{% url 'delete-contract-modal' instance.id %}?{{pd}}"
                            hx-target="{{delete_hx_target}}"
                            >
                            <ion-icon
                            name="trash-outline"
                            role="img"
                            class="md hydrated"
                            aria-label="{% trans 'trash outline' %}"
                            ></ion-icon>{% trans "Delete" %}
                        </a>
                    {% endif %}


        {% endif %}
