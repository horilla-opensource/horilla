<div class="alert alert-block alert-{{ notice.level }}">
  <form method="post" action="{% url 'notifications:mark_as_read' notice.slug %}" class="pull-right">
    {% csrf_token %}
    <button class="close" type="submit" aria-label="Mark notification as read">
      <i class="icon-close"></i>
    </button>
  </form>

  <h4>
    <i class="icon-mail{% if notice.unread %}-alt{% endif %}"></i>
    {{ notice.verb }}
  </h4>

  <p>{{ notice.timesince }} ago</p>

</div>
