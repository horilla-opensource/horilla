pid /tmp/nginx.pid;
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format hydra escape=json
        '{"timestamp":"$time_iso8601","request_id":"$hydra_request_id",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"request_seconds":$request_time,"upstream_seconds":"$upstream_response_time",'
        '"bytes":$body_bytes_sent}';
    access_log /dev/stdout hydra;
    error_log /dev/stderr warn;

    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream hydra_web {
        zone hydra_web 64k;
        server server:8000 resolve;
        keepalive 64;
    }

    map $http_x_request_id $hydra_request_id {
        "~^[A-Za-z0-9._:-]{8,128}$" $http_x_request_id;
        default $request_id;
    }
    map $http_x_forwarded_proto $hydra_forwarded_proto {
        "https" https;
        default $scheme;
    }

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
    client_max_body_size 26m;

    server {
        listen 8080;

        location = /health/ {
            proxy_pass http://hydra_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $hydra_forwarded_proto;
            proxy_set_header X-Request-ID $hydra_request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location = /health/ready/ {
            proxy_pass http://hydra_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $hydra_forwarded_proto;
            proxy_set_header X-Request-ID $hydra_request_id;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        location = /login/ {
            limit_req zone=login burst=30 nodelay;
            proxy_pass http://hydra_web;
            include /etc/nginx/hydra-proxy.conf;
        }

        location /static/ {
            alias /srv/hydra/static/;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        location /media/ {
            alias /srv/hydra/media/;
            access_log off;
            expires 1h;
            add_header Cache-Control "private, max-age=3600" always;
        }

        location / {
            proxy_pass http://hydra_web;
            include /etc/nginx/hydra-proxy.conf;
        }
    }
}
