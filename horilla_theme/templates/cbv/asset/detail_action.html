{% load static i18n %}
{% if perms.asset.change_assetlot %}
    <!-- Start of Edit Button -->
    <button
        data-toggle="oh-modal-toggle"
        data-target="#genericModal"
        hx-get="{{ instance.get_update_url }}?instance_ids={{ instance.ordered_ids }}"
        hx-target="#genericModalBody"
        class="oh-btn oh-btn--light-bkg oh-btn--secondary w-24 px-4 py-2 rounded-md text-xs flex items-center justify-center gap-2 transition duration-300"
    >
        <ion-icon name="create-outline"></ion-icon>
        {% trans 'Edit' %}
    </button>
    <!-- End of Edit Button -->
{% endif %}

{{ instance.asset_items_action|safe }}

{% if perms.asset.delete_assetlot %}
    <!-- Start of Delete Form -->
    <form
        hx-confirm="{% trans 'Do you want to delete this asset ?' %}"
        hx-post="{{ instance.get_delete_url }}?instance_ids={{ instance.ordered_ids }}"
        hx-target="#AssetBatchList"
    >
        {% csrf_token %}
        <button
            data-action="delete"
            type="submit"
            class="w-24 px-4 py-2 bg-danger text-white rounded-md text-xs flex items-center justify-center gap-2 hover:bg-danger-dark transition duration-300"
        >
            <img
                src="{% static 'horilla_theme/assets/img/icons/trash.svg' %}"
                alt="{% trans 'Delete' %}"
                width="16"
                class="mt-[-1px] filter brightness-0 invert"
            >
            {% trans 'Delete' %}
        </button>
    </form>
    <!-- End of Delete Form -->
{% endif %}
