{% load static i18n generic_template_filters %}

<div class="flex items-center gap-1">
    {% if perms.recruitment.change_recruitmentsurvey %}
        <a
            class="oh-btn oh-btn--light-bkg w-24 px-4 py-2 rounded-md text-xs flex items-center justify-center gap-2 transition duration-300"
            title="{% trans 'Edit' %}"
            hx-get="{% url 'recruitment-survey-question-template-edit' instance.id %}"
            hx-target="#genericModalBody"
            data-toggle="oh-modal-toggle"
            data-target="#genericModal"
        >
            <ion-icon name="create-outline"></ion-icon>
            {% trans 'Edit' %}
        </a>
    {% endif %}

    {% if perms.recruitment.delete_recruitmentsurvey %}
        <a
            class="w-24 px-4 py-2 bg-danger text-white rounded-md text-xs flex items-center justify-center gap-2 hover:bg-danger-dark transition duration-300"
            title="{% trans 'Delete' %}"
            href="{% url 'recruitment-survey-question-template-delete' instance.id %}"
            onclick="return confirm('{% trans 'Are you sure you want to delete this survey question template?'|escapejs %}')"
        >
            <img
                src="{% static 'horilla_theme/assets/img/icons/trash.svg' %}"
                alt="{% trans 'Delete' %}"
                width="13"
                class="mt-[-1px] filter brightness-0 invert"
            >
            {% trans 'Delete' %}
        </a>
    {% endif %}
</div>
