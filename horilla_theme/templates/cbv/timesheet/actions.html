{% load i18n %}
{% load taskfilters %}
{% if request.user|time_sheet_crud_perm:instance or perms.project.change_timesheet or perms.project.delete_timesheet %}
    <div class="flex items-center justify-center gap-1" onclick="event.stopPropagation();event.preventDefault()">
        <a
            class="oh-btn oh-btn--light-bkg oh-btn--sq-sm"
            data-toggle="oh-modal-toggle"
            data-target="{% if request.task_id %}#addTimesheetModal{% else %}#genericModal{% endif %}"
            hx-get="{% if request.task_id %}{% url 'update-time-sheet' instance.id %}?task_id={{ request.task_id }}{% else %}{% url 'update-time-sheet' instance.id %}{% endif %}"
            hx-target="{% if request.task_id %}#addTimesheetModalBody{% else %}#genericModalBody{% endif %}"
        >
            <ion-icon
                name="create-outline"
                role="img"
                class="md hydrated"
                aria-label="{% trans 'create outline' %}"
            ></ion-icon>
        </a>
        {% if request.task_id %}
            <a
                class="oh-btn oh-btn--danger oh-btn--sq-sm"
                hx-delete="{% url 'delete-time-sheet' instance.id %}?view=list&task_id={{ request.task_id }}&employee_id=request.user.employee_get.id"
                hx-confirm="{% trans 'Do you want to delete this timesheet?' %}"
                hx-target="#TaskTimesheetTarget"
            >
                <ion-icon
                    name="trash-outline"
                    role="img"
                    class="md hydrated"
                    aria-label="{% trans 'trash outline' %}"
                ></ion-icon>
            </a>
        {% else %}
            <a
                class="oh-btn oh-btn--danger oh-btn--sq-sm"
                href="{% url 'delete-time-sheet' instance.id %}?view=list"
                onclick="confirm(`{% trans 'Do you want to delete this timesheet?' %}`)"
            >
                <ion-icon
                    name="trash-outline"
                    role="img"
                    class="md hydrated"
                    aria-label="{% trans 'trash outline' %}"
                ></ion-icon>
            </a>
        {% endif %}
    </div>
{% else %}
    <div class="flex items-center justify-center gap-1" onclick="event.stopPropagation();event.preventDefault()">
        <a class="oh-btn oh-btn--danger oh-btn--sq-sm oh-btn--disabled">
            <ion-icon
                name="create-outline"
                role="img"
                class="md hydrated"
                style="color: blue"
                aria-label="{% trans 'create outline' %}"
            ></ion-icon>
        </a>

        <a class="oh-btn oh-btn--danger oh-btn--sq-sm oh-btn--disabled">
            <ion-icon name="trash-outline" role="img" class="md hydrated" aria-label="trash outline"></ion-icon>
        </a>
    </div>
{% endif %}
