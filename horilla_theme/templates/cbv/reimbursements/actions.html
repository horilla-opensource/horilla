{% load i18n static %}

{% if perms.payroll.change_reimbursement %}
    <div id="requestCard{{ instance.id }}" onclick="event.stopPropagation()">
        <form
            hx-get="{% url 'approve-reimbursements' %}"
            hx-swap="none"
            onclick="event.stopPropagation()"
        >
            <input type="hidden" name="ids" value="{{ instance.id }}">
            <input type="hidden" name="status">
            <input type="hidden" name="amount" default="0" min="0">

            <div class="flex items-center justify-center gap-1" onclick="event.stopPropagation()">
                {% if instance.status == 'requested' %}
                    <button
                        type="button"
                        title="{% trans 'Approve' %}"
                        onclick="reimbursementConfirm('Do You really want to approve the request?','#requestCard{{ instance.id }}',true);$('#requestCard{{ instance.id }} [name=status]').val('approved')"
                        class="h-7 w-7 flex items-center justify-center bg-success text-white rounded-md hover:bg-success-dark transition duration-300"
                    >
                        <img
                            src="{% static 'horilla_theme/assets/img/icons/check.svg' %}"
                            alt="{% trans 'Approve' %}"
                            width="13"
                            class="filter brightness-0 invert"
                        >
                    </button>
                {% else %}
                    <button
                        title="{% trans 'Approve' %}"
                        type="button"
                        class="h-7 w-7 flex items-center justify-center bg-success text-white rounded-md hover:bg-success-dark transition duration-300 oh-btn--disabled"
                    >
                        <img
                            src="{% static 'horilla_theme/assets/img/icons/check.svg' %}"
                            alt="{% trans 'Approve' %}"
                            width="13"
                            class="filter brightness-0 invert"
                        >
                    </button>
                {% endif %}

                {% if instance.status == 'rejected' %}
                    <button
                        class="h-7 w-7 flex items-center justify-center bg-danger text-white rounded-md hover:bg-danger-dark transition duration-300"
                        disabled
                        onclick="event.preventDefault()"
                    >
                        <img
                            src="{% static 'horilla_theme/assets/img/icons/close-circle-icon-original.svg' %}"
                            alt="{% trans 'Reject' %}"
                            width="13"
                            class="filter brightness-0 invert"
                        >
                    </button>
                {% else %}
                    <button
                        type="button"
                        onclick="$('#requestCard{{ instance.id }} [name=amount]').attr('required',false);reimbursementConfirm('Do You really want to reject the request?','#requestCard{{ instance.id }}');$('#requestCard{{ instance.id }} [name=status]').val('canceled')"
                        class="h-7 w-7 flex items-center justify-center bg-danger text-white rounded-md hover:bg-danger-dark transition duration-300"
                    >
                        <img
                            src="{% static 'horilla_theme/assets/img/icons/close-circle-icon-original.svg' %}"
                            alt="{% trans 'Reject' %}"
                            width="13"
                            class="filter brightness-0 invert"
                        >
                    </button>
                {% endif %}
            </div>

            <input type="submit" hidden id="requestCard{{ instance.id }}Button">
        </form>
    </div>
{% endif %}
