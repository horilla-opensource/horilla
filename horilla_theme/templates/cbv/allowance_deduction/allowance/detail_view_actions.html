{% load static i18n %}
{% if perms.payroll.change_allowance %}
    <!-- Start of Edit a Tag -->
    <a
        href="#"
        hx-get="{% url 'update-allowance' instance.id %}"
        data-toggle="oh-modal-toggle"
        data-target="#objectCreateModal"
        hx-target="#objectCreateModalTarget"
        hx-swap="innerHTML"
        onclick="event.stopPropagation()"
        hx-on:click="$(this).closest('.oh-modal--show').removeClass('oh-modal--show');"
        class="oh-btn oh-btn--light-bkg oh-btn--secondary w-24 px-4 py-2 rounded-md text-xs flex items-center justify-center gap-2 transition duration-300"
    >
        <ion-icon name="create-outline"></ion-icon>
        {% trans 'Edit' %}
    </a>
    <!-- End of Edit a Tag -->
{% endif %}

{% if perms.payroll.delete_allowance %}
    <!-- Start of Delete Form -->
    <form
        hx-confirm="{% trans 'Do you want to delete this allowance ?' %}"
        hx-post="{% url 'delete-allowance' instance.id %}?instances_ids={{ request.GET.instance_ids }}"
        hx-target="#genericModalBody"
    >
        {% csrf_token %}
        <button
            data-action="delete"
            type="submit"
            class="w-24 px-4 py-2 bg-danger text-white rounded-md text-xs flex items-center justify-center gap-2 hover:bg-danger-dark transition duration-300"
        >
            <img
                src="{% static 'horilla_theme/assets/img/icons/trash.svg' %}"
                alt="{% trans 'Delete' %}"
                width="16"
                class="mt-[-1px] filter brightness-0 invert"
            >
            {% trans 'Delete' %}
        </button>
    </form>
    <!-- End of Delete Form -->
{% endif %}
{% if request.GET.deleted %}
    <script>
        $(".reload-record").click();
        $("#reloadMessagesButton").click();
    </script>
{% endif %}
