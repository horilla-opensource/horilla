{% load i18n static %}
{% if perms.base.change_employeeshiftschedule %}
    <a
        data-toggle="oh-modal-toggle"
        data-target="#genericModal"
        hx-get="{% url 'settings-employee-shift-shedule-update' instance.id %}"
        hx-target="#genericModalBody"
        class="oh-btn oh-btn--light-bkg oh-btn--secondary w-24 px-4 py-2 rounded-md text-xs flex items-center justify-center gap-2 transition duration-300"
    >
        <ion-icon name="create-outline"></ion-icon>
        {% trans "Edit" %}
    </a>
{% endif %}

{% if perms.base.delete_employeeshiftschedule %}
    <a
        hx-confirm="{% trans 'Are you sure you want to delete this schedule?' %}"
        hx-post="{% url 'employee-shift-schedule-delete' instance.id %}"
        hx-target="#genericModal"
        hx-swap="innerHTML"
        class="w-24 px-4 py-2 bg-danger rounded-md text-xs flex items-center justify-center gap-2 hover:bg-danger-dark text-white transition duration-300"
    >
        <img
            src="{% static 'horilla_theme/assets/img/icons/trash.svg' %}"
            alt="{% trans 'Delete' %}"
            width="16"
            class="mt-[-1px] filter brightness-0 invert"
        >
        {% trans "Delete" %}
    </a>
{% endif %}
