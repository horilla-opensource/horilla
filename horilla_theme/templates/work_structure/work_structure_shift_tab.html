{% load i18n static %}

<div class="oh-inner-sidebar-content border border-[#ebebeb] rounded-md mb-5">
    <div hx-get="{% url 'employee-shift-nav' %}" hx-trigger="load"></div>

    <p class="text-xs text-gray-500 mt-1 ml-3">
        {% trans "Create and manage shift definitions used across the organization." %}
    </p>

    <div
        class="oh-checkpoint-badge mb-2"
        id="selectedInstances"
        data-ids="[]"
        data-clicked=""
        style="display: none"
    >
    </div>

    <div class="oh-wrapper" id="listContainer">
        <div class="animated-background"></div>
    </div>
</div>

<div class="oh-modal" id="shiftModal" role="dialog" aria-labelledby="shiftModalLabel" aria-hidden="true">
    <div class="oh-modal__dialog" id="shiftForm"></div>
</div>

<script src="{% static 'cbv/deleteFunc.js' %}"></script>
