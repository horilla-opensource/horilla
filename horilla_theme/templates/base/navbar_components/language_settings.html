{% load static i18n %}
{% get_current_language as LANGUAGE_CODE %}
<div class="dropdown-content absolute right-0 z-10 w-max min-w-56 max-w-[22rem] rounded-lg bg-white py-2 [box-shadow:0px_0px_20px_0px_rgb(0_0_0_/_8%)]">
    <ul class="max-h-[70vh] overflow-y-auto text-sm">
        {% for language in navbar_languages %}
            {% with IMAGE_PATH='images/ui/'|add:language.0|add:'.png' %}
                <li>
                    <button
                        type="button"
                        class="flex w-full items-center gap-2 px-4 py-1.5 text-sm transition duration-300 hover:text-primary-600"
                        onclick="event.preventDefault();document.getElementById('language-form-{{ language.0 }}').submit()"
                    >
                        <span class="h-6 w-6 shrink-0 overflow-hidden rounded-full">
                            <img
                                src="{% static IMAGE_PATH %}"
                                alt=""
                                class="h-full w-full object-cover"
                            >
                        </span>
                        <span class="whitespace-nowrap text-left">
                            {{ language.1 }}
                        </span>
                        {% if language.0 == LANGUAGE_CODE %}
                            <span class="ml-auto flex h-6 w-6 shrink-0 items-center justify-center">
                                <ion-icon
                                    name="checkmark-circle-outline"
                                    style="color: green; font-size: 1.2em"
                                >
                                </ion-icon>
                            </span>
                        {% endif %}
                    </button>
                    <form
                        id="language-form-{{ language.0 }}"
                        action="{% url 'set_language' %}"
                        method="post"
                        style="display: none"
                    >
                        {% csrf_token %}
                        <input type="hidden" name="language" value="{{ language.0 }}">
                    </form>
                </li>
            {% endwith %}
        {% endfor %}
    </ul>
</div>
