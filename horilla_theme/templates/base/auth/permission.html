{% extends 'settings.html' %}
{% block settings %}
    <script>
        function checkSelected(names, target, initial = false) {
          names = JSON.parse(`${names}`);
          $.each(names, function (indexInArray, valueOfElement) {
            if (!initial) {
              $(target)
                .find(`[value=${valueOfElement}]`)
                .prop("checked", true)
                .change();
            } else {
              $(target).find(`[value=${valueOfElement}]`).prop("checked", true);
            }
          });
          if (typeof refreshPermPicker === "function") {
            var $picker = $(target).closest("[data-perm-picker]");
            if (!$picker.length) {
              $picker = $(target).find("[data-perm-picker]");
            }
            if ($picker.length) {
              refreshPermPicker($picker);
            }
          }
        }
        var showSearch = true
    </script>

    {% include "base/auth/permission_accordion.html" %}

    <script>
        // Inner accordion logic — rebind after page load or HTMX swap

        $(document).on("click", ".inner-accordion-toggle", function (e) {
            const $toggle = $(this);

            // Find the correct content (scoped)
            const $content = $toggle
                .parent()
                .find(".inner-accordion-content")
                .first();

            if (!$content.length) return;

            const isOpen =
                $content.css("max-height") !== "0px" &&
                $content.css("max-height") !== "none";

            if (isOpen) {
                $content.css({
                    "max-height": "0",
                    "opacity": "0",
                });
            } else {
                $content.css({
                    "max-height": $content[0].scrollHeight + "px",
                    "opacity": "1",
                });
            }

            // Resize outer accordion
            const $outerPanel = $toggle.closest(".accordion-panel-gp");
            if ($outerPanel.length) {
                setTimeout(function () {
                    $outerPanel.css(
                        "max-height",
                        $outerPanel[0].scrollHeight + "px"
                    );
                }, 250);
            }
        });

        function updateBadge() {
          if (typeof refreshPermPicker === "function") {
            $("[data-perm-picker]").each(function () {
              refreshPermPicker($(this));
            });
            return;
          }

          $(".accordion-wrapper").each(function () {
            const wrapper = $(this);

            wrapper.find(".panel.view-employees").each(function () {
              const panel = $(this);
              const badge = panel.prev(".inner-accordion-toggle").find(".permission-badge");
              const checkedCount = panel.find("[name=permissions]:checked").length;

              badge.text(checkedCount);
              badge.attr("title", checkedCount + " Permissions");
            });

            wrapper.find("table").each(function () {
              const table = $(this);
              const allCheckboxes = table.find("tbody [name=permissions]");
              const checkedCheckboxes = table.find("tbody [name=permissions]:checked");
              const selectAll = table.find(".row-permission__select-all");

              selectAll.prop("checked", allCheckboxes.length === checkedCheckboxes.length);
            });

            wrapper.find("tbody tr").each(function () {
              const row = $(this);
              const rowPermissionCheckbox = row.find(".row-permission");
              const rowPermissionCount = row.find("[name=permissions]:checked").length;

              rowPermissionCheckbox.prop("checked", rowPermissionCount === 4);
            });
          });
        }

        // Select all per table
        function selectAllPermissions(source) {
          if (typeof window.selectAllPermissions === "function" && window.selectAllPermissions !== selectAllPermissions) {
            return window.selectAllPermissions(source);
          }
          const isChecked = $(source).is(":checked");
          const table = $(source).closest("table");
          const $rows = table.find("tr.perm-feature-row").not(".hidden");
          $rows.each(function () {
            $(this).find("[name=permissions]").prop("checked", isChecked);
            $(this).find(".row-permission").prop("checked", isChecked);
          });
          if (typeof refreshPermPicker === "function") {
            refreshPermPicker($(source).closest("[data-perm-picker]"));
          }
          const $any = $rows.find("[name=permissions]").first();
          if ($any.length) {
            $any.trigger("change");
          }
        }

        // Trigger badge count on load (for already checked states)
        $(document).ready(() => {
          updateBadge();
        });
    </script>
{% endblock settings %}
