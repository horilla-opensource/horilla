    /* Legacy (non-Tailwind) primary CTA button — used by most Save/Create
       forms across the app. Recolor it to follow the selected company
       theme, same as the Tailwind 'brand'/'primary' color below. */
    .oh-btn--secondary,
    .oh-btn--secondary:disabled {
        background-color: {{ theme_obj.primary_600|default:"#E54F38" }} !important;
    }
    .oh-btn--secondary:hover,
    .oh-btn--secondary:focus,
    .oh-btn--secondary:focus-visible {
        background-color: {{ theme_obj.primary_700|default:"#ce4732" }} !important;
    }
    .oh-btn--secondary-outline,
    .oh-btn--secondary-link {
        color: {{ theme_obj.primary_600|default:"#E54F38" }} !important;
    }
    .oh-btn--secondary-outline:hover,
    .oh-btn--secondary-outline:focus,
    .oh-btn--secondary-outline:focus-visible,
    .oh-btn--secondary-link:hover,
    .oh-btn--secondary-link:focus,
    .oh-btn--secondary-link:focus-visible {
        color: {{ theme_obj.primary_700|default:"#ce4732" }} !important;
    }

    /* Active-filter chip bar ("Filters:" label + each filter's remove-X,
       e.g. "Is active: Yes"). Follow the selected company theme too. */
    .oh-titlebar__tag--custom {
        background-color: {{ theme_obj.primary_600|default:"#E54F38" }} !important;
    }
    .oh-titlebar__tag-close {
        background-color: {{ theme_obj.primary_600|default:"#E54F38" }} !important;
    }
    .oh-titlebar__tag-close:hover {
        background-color: {{ theme_obj.primary_700|default:"#ce4732" }} !important;
    }
    .oh-titlebar__tag.filter-field {
        border-color: {{ theme_obj.primary_600|default:"#E54F38" }} !important;
    }

    /* "Save And Add Another" — secondary CTA next to Save on create forms.
       Uses a lighter tint of the theme color so it stays visually distinct
       from the solid "Save" button while still following the theme. */
    .oh-btn--add-another {
        background-color: {{ theme_obj.primary_500|default:"#F7C8C1" }} !important;
        color: #ffffff !important;
        border: 1px solid {{ theme_obj.primary_500|default:"#F7C8C1" }} !important;
    }
    .oh-btn--add-another:hover,
    .oh-btn--add-another:focus,
    .oh-btn--add-another:focus-visible {
        background-color: {{ theme_obj.primary_600|default:"#E54F38" }} !important;
        border-color: {{ theme_obj.primary_600|default:"#E54F38" }} !important;
    }

    /* Checkmark bullet on "Changes" list items (e.g. Employee > History tab). */
    .list-checked li:before {
        color: {{ theme_obj.primary_600|default:"#E54F38" }} !important;
    }

    /* Legacy light icon button (e.g. the "View Comment" icon on Shift/Work
       Type/Document request lists). Icon color follows the theme too. */
    .oh-btn--light {
        color: {{ theme_obj.primary_600|default:"#E54F38" }} !important;
    }
    .oh-btn--light:hover,
    .oh-btn--light:focus,
    .oh-btn--light:focus-visible {
        color: {{ theme_obj.primary_700|default:"#ce4732" }} !important;
    }
</style>
<script>
    document.addEventListener("DOMContentLoaded", function () {
    var btn = document.getElementById("themeToggleButton");
    if (!btn) return;

    btn.addEventListener("click", function (e) {
        e.preventDefault();

        fetch("{% url 'toggle_theme' %}", {
        method: "POST",
        headers: {
            "X-CSRFToken": "{{ csrf_token }}",
            "X-Requested-With": "XMLHttpRequest"
        }
        })
        .then(response => {
        if (response.status === 204) {
            // Since server stored the new theme, we just mirror it in the UI

            const isDark = document.documentElement.classList.toggle("dark");
            document.body.classList.toggle("dark", isDark);

            const icon = btn.querySelector("i");
            if (icon) {
            icon.classList.toggle("fa-moon", !isDark);
            icon.classList.toggle("fa-lightbulb", isDark);
            }
        }
        })
        .catch(err => console.error(err));
    });
    });
</script>

<script>
    // Site-wide: keep tabbed list panels (e.g. Attendance To Validate / OT /
    // Validated, Requested / All Attendances) the same size as a plain list
    // view (e.g. Employees) regardless of how many rows a given tab has.
    // Uses a single MutationObserver on <body> rather than specific htmx
    // event names, so it keeps working no matter which code path swaps the
    // content in (declarative hx-get, htmx.ajax(), a raw jQuery fallback, or
    // a full SPA page navigation that replaces #listContainer itself).
    (function () {
        var BOTTOM_MARGIN = 20; // matches the plain list view's own bottom gap
        var SELECTOR = "#listContainer .heightContainer, #listContainer .attendance-request-scroll";
        var pending = null;

        function sizeVisibleScrollContainers() {
            var containers = document.querySelectorAll(SELECTOR);
            for (var i = 0; i < containers.length; i++) {
                var container = containers[i];
                if (container.offsetParent === null) {
                    continue; // hidden (inactive tab) - leave it alone
                }
                var top = container.getBoundingClientRect().top;
                var height = window.innerHeight - top - BOTTOM_MARGIN;
                if (height > 100) {
                    container.style.maxHeight = height + "px";
                    container.style.minHeight = height + "px";
                }
            }
        }

        function scheduleResize() {
            if (pending) {
                clearTimeout(pending);
            }
            pending = setTimeout(sizeVisibleScrollContainers, 30);
        }

        window.addEventListener("resize", scheduleResize);
        document.addEventListener("DOMContentLoaded", function () {
            scheduleResize();
            if (window.MutationObserver) {
                new MutationObserver(function (mutations) {
                    for (var i = 0; i < mutations.length; i++) {
                        if (mutations[i].addedNodes.length) {
                            scheduleResize();
                            return;
                        }
                    }
                }).observe(document.body, { childList: true, subtree: true });
            }
        });
        scheduleResize();
    })();
</script>

<script>
    // Site-wide: grouped/accordion list views (generic/group_by_table.html,
    // e.g. Hour Accounts) reload their ENTIRE accordion whenever a single
    // group's own pagination is used (each group's page-jump control targets
    // the shared outer container). The server only marks the first group open
    // by default, so every OTHER group the user had manually expanded would
    // collapse back on that reload. Capture which groups were open right
    // before the swap and re-open them once the new content lands.
    (function () {
        var openGroupsByContainerId = {};

        function captureOpenGroups(target) {
            if (!target || !target.id) {
                return;
            }
            var headers = target.querySelectorAll(".oh-accordion.oh-accordion--show > .oh-accordion-header[data-group]");
            if (headers.length) {
                openGroupsByContainerId[target.id] = Array.prototype.map.call(headers, function (header) {
                    return header.getAttribute("data-group");
                });
            }
        }

        function restoreOpenGroups(containerId) {
            var indices = openGroupsByContainerId[containerId];
            if (!indices) {
                return;
            }
            var container = document.getElementById(containerId);
            if (!container) {
                return;
            }
            indices.forEach(function (idx) {
                var header = container.querySelector('.oh-accordion-header[data-group="' + idx + '"]');
                if (header) {
                    header.closest(".oh-accordion").classList.add("oh-accordion--show");
                }
            });
        }

        // Captured on beforeRequest (not beforeSwap): a separate site-wide
        // loading-indicator handler wipes the target's content down to a
        // skeleton div as soon as the request starts, so by the time
        // beforeSwap fires the old accordion state is already gone. This
        // script is loaded in <head>, ahead of that handler (loaded in the
        // footer), so it observes the DOM before the wipe happens.
        document.addEventListener("htmx:beforeRequest", function (evt) {
            captureOpenGroups(evt.detail.target);
        });

        document.addEventListener("htmx:afterSwap", function (evt) {
            var id = evt.detail.target && evt.detail.target.id;
            if (id) {
                restoreOpenGroups(id);
            }
        });
    })();
</script>
