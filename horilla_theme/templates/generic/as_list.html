{% load i18n %}
<form class="pt-5" hx-get="{% url 'toggle-columns' %}" hx-swap="none">
    <input type="hidden" name="path" value="{{request.path_info}}">
    <ul class="oh-dropdown__items toggleForm">
        <li class="oh-dropdown__item oh-sticy-dropdown-item">
            <span class="text-sm">{% trans "Select All" %}</span>
            <span class="oh-table__checkbox">
                <input
                    type="checkbox"
                    class="custom-checkbox toggle-select-all"
                    onclick="var checked = $(this).is(':checked');
					var $form = $(this).closest('form');
					$form.find('.toggle-column-checkbox').each(function () {
						$(this).prop('checked', checked);
						$(this)
							.siblings('input[type=hidden]')
							.val(checked ? '' : 'off');
					});
					toggleAllColumnsVisibility($form[0], checked);
					persistColumnToggle($form[0])"
                >
            </span>
        </li>
        {% for field in form.visible_fields %}
            <li class="oh-dropdown__item oh-sticy-dropdown-item">
                {% if forloop.counter  == 1 %}
                    <span class="text-sm">{{ field.label }}</span>
                {% else %}
                    <div class="cursor-grab">
                        <span class="text-secondary me-3 fs-5">≡</span>
                        <span class="text-sm">{{ field.label }}</span>
                    </div>
                {% endif %}
                <span class="oh-table__checkbox">
                    <input
                        type="hidden"
                        name="{{field.name}}"
                        onchange="$(this).closest('form').find('[type=submit]').click()"
                        {% if not field.initial %}
                            value="false"
                        {% endif %}
                    >
                    <input
                        type="checkbox"
                        class="custom-checkbox toggle-column-checkbox"
                        id="toggle_{{field.name}}"
                        {% if field.initial %}
                            checked
                        {% endif %}
                        onclick="value = '';
						if (!$(this).is(':checked')) {
							value = 'off';
						}
						toggleColumnVisibility(this, '{{field.name}}', $(this).is(':checked'));
						$(this)
							.siblings('input[type=hidden]')
							.val(value);
						persistColumnToggle($(this).closest('form')[0]);
						var $form = $(this).closest('form');
						$form.find('.toggle-select-all').prop(
							'checked',
							$form.find('.toggle-column-checkbox').length === $form.find('.toggle-column-checkbox:checked').length
						)"
                    >
                </span>
            </li>
        {% endfor %}
    </ul>
    <input type="submit" hidden>
</form>

<script>
    $(".toggleForm").sortable({
        items: "> li:not(:first)",
        cancel: ":first",
        stop: function () {
            $(this).closest('form').find('[type=submit]').click();
        }
    });

    // Keep "Select All"'s own initial state consistent with whatever the
    // individual columns actually start checked/unchecked as (some columns
    // can already be hidden from a previously saved preference). Scoped
    // per-form via .each() since a page can have several of these dropdowns
    // open at once (e.g. one per accordion group) - a plain combined
    // selector would average their states together instead of keeping each
    // instance independent.
    (function () {
        $(".toggleForm").each(function () {
            var $form = $(this).closest("form");
            var $columns = $form.find(".toggle-column-checkbox");
            $form.find(".toggle-select-all").prop(
                "checked",
                $columns.length === $columns.filter(":checked").length
            );
        });
    })();
</script>
