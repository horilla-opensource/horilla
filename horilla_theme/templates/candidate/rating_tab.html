{% load static audit_filters i18n %}
<style>
    .note-item {
        border: 1px solid #e6e6e6;
        border-radius: 6px;
        padding: 0.5rem 0.75rem;
        margin-bottom: 0.5rem;
        gap: 0.75rem;
        font-size: 0.8125rem;
    }
    .note-item:hover {
        background-color: #fafafa;
    }
</style>
<div id="ratingTarget" class="pr-3">
    <div class="mt-4 mb-3 flex items-center justify-between flex-wrap gap-2">
        <span class="text-md font-semibold">{{ candidate }}'s {% trans "Ratings" %}</span>
        {% if ratings.paginator.num_pages > 1 %}
            <div class="hlv-pagination inline-flex items-center h-8 gap-0.5 bg-white border border-[#e6e6e6] rounded-md px-1 flex-shrink-0">
                <button
                    type="button"
                    class="w-7 h-7 flex items-center justify-center rounded text-xs leading-none transition duration-300 {% if ratings.has_previous %}text-[#666] hover:bg-[#f5f5f5]{% else %}text-[#ccc] cursor-not-allowed{% endif %}"
                    {% if ratings.has_previous %}
                    hx-target="#ratingTarget"
                    hx-swap="outerHTML"
                    hx-get="{% url 'hzp-profile-tab' tab_key='candidateprofileview-Rating' pk=candidate.id %}?page=1"
                    {% endif %}
                >
                    <i class="fa-solid fa-angles-left"></i>
                </button>
                <button
                    type="button"
                    class="w-7 h-7 flex items-center justify-center rounded text-xs leading-none transition duration-300 {% if ratings.has_previous %}text-[#666] hover:bg-[#f5f5f5]{% else %}text-[#ccc] cursor-not-allowed{% endif %}"
                    {% if ratings.has_previous %}
                    hx-target="#ratingTarget"
                    hx-swap="outerHTML"
                    hx-get="{% url 'hzp-profile-tab' tab_key='candidateprofileview-Rating' pk=candidate.id %}?page={{ ratings.previous_page_number }}"
                    {% endif %}
                >
                    <i class="fa-solid fa-angle-left"></i>
                </button>
                <div class="flex items-center gap-1 px-1 h-7 text-xs text-[#666] leading-none">
                    <input
                        type="number"
                        name="page"
                        min="1"
                        max="{{ ratings.paginator.num_pages }}"
                        value="{{ ratings.number }}"
                        title="{% trans 'Enter a page number and press Enter' %}"
                        class="w-9 h-6 m-0 py-0 px-1 text-center text-xs leading-6 border border-[#e6e6e6] rounded outline-none focus:border-primary-600 [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
                        hx-target="#ratingTarget"
                        hx-swap="outerHTML"
                        hx-get="{% url 'hzp-profile-tab' tab_key='candidateprofileview-Rating' pk=candidate.id %}"
                        hx-trigger="keyup[keyCode==13] changed, blur changed"
                        onclick="this.select()"
                    >
                    <span class="inline-flex items-center h-6 leading-none whitespace-nowrap">/ {{ ratings.paginator.num_pages }}</span>
                </div>
                <button
                    type="button"
                    class="w-7 h-7 flex items-center justify-center rounded text-xs leading-none transition duration-300 {% if ratings.has_next %}text-[#666] hover:bg-[#f5f5f5]{% else %}text-[#ccc] cursor-not-allowed{% endif %}"
                    {% if ratings.has_next %}
                    hx-target="#ratingTarget"
                    hx-swap="outerHTML"
                    hx-get="{% url 'hzp-profile-tab' tab_key='candidateprofileview-Rating' pk=candidate.id %}?page={{ ratings.next_page_number }}"
                    {% endif %}
                >
                    <i class="fa-solid fa-angle-right"></i>
                </button>
                <button
                    type="button"
                    class="w-7 h-7 flex items-center justify-center rounded text-xs leading-none transition duration-300 {% if ratings.has_next %}text-[#666] hover:bg-[#f5f5f5]{% else %}text-[#ccc] cursor-not-allowed{% endif %}"
                    {% if ratings.has_next %}
                    hx-target="#ratingTarget"
                    hx-swap="outerHTML"
                    hx-get="{% url 'hzp-profile-tab' tab_key='candidateprofileview-Rating' pk=candidate.id %}?page={{ ratings.paginator.num_pages }}"
                    {% endif %}
                >
                    <i class="fa-solid fa-angles-right"></i>
                </button>
            </div>
        {% endif %}
    </div>

    <div class="tracking-card mt-3">
        <ol class="list-none p-0 m-0" role="list">
            {% for rate in ratings %}
                <li class="note-item flex items-center justify-between flex-wrap" style="cursor: default">
                    <div class="flex items-center gap-2 flex-1 min-w-0">
                        <span class="relative flex h-8 w-8 shrink-0 overflow-hidden rounded-full">
                            <img
                                src="{{ rate.employee_id.get_avatar }}"
                                class="h-full w-full object-cover"
                                alt="{{ rate.employee_id }}"
                            >
                        </span>
                        <span class="font-medium text-sm truncate">{{ rate.employee_id }}</span>
                    </div>

                    <div class="oh-rate flex-shrink-0" style="pointer-events: none">
                        <input type="radio" id="star5-{{ forloop.counter }}" value="5" disabled {% if rate.rating == 5 %}checked{% endif %}>
                        <label for="star5-{{ forloop.counter }}" title="{% trans '5 Stars' %}" class="star"></label>
                        <input type="radio" id="star4-{{ forloop.counter }}" value="4" disabled {% if rate.rating == 4 %}checked{% endif %}>
                        <label for="star4-{{ forloop.counter }}" title="{% trans '4 Stars' %}" class="star"></label>
                        <input type="radio" id="star3-{{ forloop.counter }}" value="3" disabled {% if rate.rating == 3 %}checked{% endif %}>
                        <label for="star3-{{ forloop.counter }}" title="{% trans '3 Stars' %}" class="star"></label>
                        <input type="radio" id="star2-{{ forloop.counter }}" value="2" disabled {% if rate.rating == 2 %}checked{% endif %}>
                        <label for="star2-{{ forloop.counter }}" title="{% trans '2 Stars' %}" class="star"></label>
                        <input type="radio" id="star1-{{ forloop.counter }}" value="1" disabled {% if rate.rating == 1 %}checked{% endif %}>
                        <label for="star1-{{ forloop.counter }}" title="{% trans '1 Star' %}" class="star"></label>
                    </div>
                </li>
            {% empty %}
                <div class="oh-wrapper h-full" align="center">
                    <div class="xl:col-span-4 md:col-span-6 col-span-12 bg-white p-6 rounded-md shadow-card h-[70%]">
                        <div class="flex flex-col items-center justify-center h-full">
                            <img src="/static/horilla_theme/assets/img/no-records.svg" alt="" width="300" class="mb-4">
                            <p class="text-[#666] mb-5">{% trans "No rating found." %}</p>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </ol>
    </div>
</div>
