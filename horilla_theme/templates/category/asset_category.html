{% load static i18n %}
<div class="accordion-wrapper space-y-2">
    {% if asset_categories.paginator.num_pages > 1 %}
        <!-- pagination start -->
        <div class="flex justify-end w-full">
            <div class="hlv-pagination inline-flex items-center h-8 gap-0.5 bg-white border border-[#e6e6e6] rounded-md px-1 flex-shrink-0">
                <button
                    type="button"
                    class="w-7 h-7 flex items-center justify-center rounded text-xs leading-none transition duration-300 {% if asset_categories.has_previous %}text-[#666] hover:bg-[#f5f5f5]{% else %}text-[#ccc] cursor-not-allowed{% endif %}"
                    {% if asset_categories.has_previous %}
                    hx-get="{% url 'asset-category-view-search-filter' %}?{{pg}}&page=1"
                    hx-target="#assetCategoryList"
                    hx-on:click="htmxLoadIndicator(this);"
                    {% endif %}
                >
                    <i class="fa-solid fa-angles-left"></i>
                </button>
                <button
                    type="button"
                    class="w-7 h-7 flex items-center justify-center rounded text-xs leading-none transition duration-300 {% if asset_categories.has_previous %}text-[#666] hover:bg-[#f5f5f5]{% else %}text-[#ccc] cursor-not-allowed{% endif %}"
                    {% if asset_categories.has_previous %}
                    hx-get="{% url 'asset-category-view-search-filter' %}?{{pg}}&page={{ asset_categories.previous_page_number }}"
                    hx-target="#assetCategoryList"
                    hx-on:click="htmxLoadIndicator(this);"
                    {% endif %}
                >
                    <i class="fa-solid fa-angle-left"></i>
                </button>
                <div class="flex items-center gap-1 px-1 h-7 text-xs text-[#666] leading-none">
                    <input
                        type="number"
                        name="page"
                        min="1"
                        max="{{ asset_categories.paginator.num_pages }}"
                        value="{{ asset_categories.number }}"
                        title="{% trans 'Enter a page number and press Enter' %}"
                        class="w-9 h-6 m-0 py-0 px-1 text-center text-xs leading-6 border border-[#e6e6e6] rounded outline-none focus:border-primary-600 [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
                        hx-target="#assetCategoryList"
                        hx-get="{% url 'asset-category-view-search-filter' %}?{{pg}}"
                        hx-trigger="keyup[keyCode==13] changed, blur changed"
                        onclick="this.select()"
                    >
                    <span class="inline-flex items-center h-6 leading-none whitespace-nowrap">/ {{ asset_categories.paginator.num_pages }}</span>
                </div>
                <button
                    type="button"
                    class="w-7 h-7 flex items-center justify-center rounded text-xs leading-none transition duration-300 {% if asset_categories.has_next %}text-[#666] hover:bg-[#f5f5f5]{% else %}text-[#ccc] cursor-not-allowed{% endif %}"
                    {% if asset_categories.has_next %}
                    hx-get="{% url 'asset-category-view-search-filter' %}?{{pg}}&page={{ asset_categories.next_page_number }}"
                    hx-target="#assetCategoryList"
                    hx-on:click="htmxLoadIndicator(this);"
                    {% endif %}
                >
                    <i class="fa-solid fa-angle-right"></i>
                </button>
                <button
                    type="button"
                    class="w-7 h-7 flex items-center justify-center rounded text-xs leading-none transition duration-300 {% if asset_categories.has_next %}text-[#666] hover:bg-[#f5f5f5]{% else %}text-[#ccc] cursor-not-allowed{% endif %}"
                    {% if asset_categories.has_next %}
                    hx-get="{% url 'asset-category-view-search-filter' %}?{{pg}}&page={{ asset_categories.paginator.num_pages }}"
                    hx-target="#assetCategoryList"
                    hx-on:click="htmxLoadIndicator(this);"
                    {% endif %}
                >
                    <i class="fa-solid fa-angles-right"></i>
                </button>
            </div>
        </div>
        <!-- end of pagination -->
    {% endif %}
    <!-- Accordion Item -->
    {% for asset_category in asset_categories %}
        <div class="accordion-item border border-primary-300 rounded-md overflow-hidden">
            <button
                class="accordion-btn w-full flex justify-between items-center px-4 py-2 text-sm transition-all bg-primary-100 text-primary-600"
                hx-get="{% url 'asset-list' cat_id=asset_category.id %}?category={{ asset_category.pk }}&{{ request.GET.urlencode }}"
                hx-target="#assetCategory{{ asset_category.id }}"
                hx-trigger="doRequest"
                _="on click if isElementVisible(me) trigger doRequest"
                hx-on:click="toggleAccordion(this)"
            >
                <div class="flex items-center gap-2">
                    <span
                        class="w-6 h-6 bg-primary-600 rounded-full text-white flex items-center justify-center text-xs"
                        id="asset-count{{asset_category.id}}"
                        data-category-id="{{asset_category.id}}"
                        title="{{asset_category.filtered_asset_count}} {% trans 'Assets' %}"
                    >
                        {{ asset_category.filtered_asset_count }}
                    </span>
                    {{ asset_category }}
                </div>
                <div class="flex items-center gap-5">
                    <ion-icon
                        name="chevron-down-outline"
                        class="icon oh-tabs__movable-fold-icon text-lg"
                        role="img"
                        aria-hidden="true"
                    ></ion-icon>
                    <span onclick="event.stopPropagation()">
                        <div class="inline-block dropdown-wrapper text-md">
                            <a class="cursor-pointer dropdown-toggle block w-4" title="{% trans 'Actions' %}">
                                <i class="fa-solid fa-ellipsis-vertical"></i>
                            </a>
                            <!-- Dropdown Content -->
                            <div class="dropdown-menu absolute right-[85px] min-w-[100px] bg-white rounded-lg shadow-card py-2 hidden z-50 transition-all duration-200">
                                <ul class="text-xs">
                                    {% if perms.asset.add_asset %}
                                        <li>
                                            <a
                                                class="w-full flex text-left px-3 py-1 text-dark-600 hover:text-primary-600 transition duration-300 asset-create"
                                                data-toggle="oh-modal-toggle"
                                                data-target="#genericModal"
                                                hx-get="{% url 'asset-creation' asset_category_id=asset_category.id %}?{{pg}}"
                                                hx-target="#genericModalBody"
                                                data-category-id="{{asset_category.id}}"
                                            >
                                                {% trans "Create" %}
                                            </a>
                                        </li>
                                    {% endif %}
                                    {% if perms.asset.add_assetcategory %}
                                        <li>
                                            <a
                                                class="w-full flex text-left px-3 py-1 text-dark-600 hover:text-primary-600 transition duration-300"
                                                data-toggle="oh-modal-toggle"
                                                data-target="#genericModal"
                                                hx-get="{% url 'asset-category-duplicate' obj_id=asset_category.id %}?{{pg}}"
                                                hx-target="#genericModalBody"
                                            >
                                                {% trans "Duplicate" %}
                                            </a>
                                        </li>
                                    {% endif %}
                                    {% if perms.asset.change_assetcategory %}
                                        <li>
                                            <a
                                                class="w-full flex text-left px-3 py-1 text-dark-600 hover:text-primary-600 transition duration-300"
                                                data-toggle="oh-modal-toggle"
                                                data-target="#genericModal"
                                                hx-get="{% url 'asset-category-update' pk=asset_category.id %}?{{pg}}"
                                                hx-target="#genericModalBody"
                                            >
                                                {% trans "Edit" %}
                                            </a>
                                        </li>
                                    {% endif %}
                                    {% if perms.asset.delete_assetcategory %}
                                        <li>
                                            <a
                                                class="w-full flex text-left px-3 py-1 text-danger hover:text-danger-dark transition duration-300"
                                                hx-get="{% url 'generic-delete-asset-category' %}?model=asset.AssetCategory&pk={{asset_category.id}}"
                                                hx-target="#deleteConfirmationBody"
                                                data-target="#deleteConfirmation"
                                                data-toggle="oh-modal-toggle"
                                            >
                                                {% trans "Delete" %}
                                            </a>
                                        </li>
                                    {% endif %}
                                </ul>
                            </div>
                        </div>
                    </span>
                </div>
            </button>
            <div
                class="accordion-panel max-h-0 overflow-hidden transition-all duration-300 bg-white px-4 text-sm text-gray-700"
                id="assetCategory{{asset_category.id}}"
                style="max-height: 0px"
            >
            </div>
        </div>
    {% endfor %}
</div>
{% if perms.asset.add_assetlot %}
    <span
        name=""
        id="dynamicBatchNoModal"
        style="display: none"
        data-toggle="oh-modal-toggle"
        data-target="#dynamicCreateModal"
        hx-get="{% url 'asset-batch-number-creation' %}"
        hx-target="#dynamicCreateModalTarget"
    >
    </span>
{% endif %}

<script>
    $(document).ready(function(){
        reloadMessage()
    })
    {% if request.GET.asset_lot_number_id %}
        // Arrived here from the "N Assets" link on Asset Batches. Every
        // category still renders (the lot filter only narrows each
        // category's own asset-count badge, not which categories show up),
        // so auto-open the one category whose badge shows this lot actually
        // has assets in it, instead of leaving the user to find and click it
        // themselves. toggleAccordion() only handles the visual open/close;
        // its content is lazy-loaded via htmx (normally fired by the
        // hyperscript "on click" handler through the "doRequest" custom
        // trigger) -- htmx.trigger() for that custom event turned out to
        // race htmx's own attribute processing on this freshly-swapped
        // fragment and silently no-op, so this fires the equivalent request
        // directly through htmx's JS API instead, using the same hx-get/
        // hx-target the button already declares.
        $(document).ready(function () {
            $(".accordion-btn").each(function () {
                var countEl = this.querySelector("[id^='asset-count']");
                var count = countEl ? parseInt(countEl.textContent.trim(), 10) : 0;
                if (count > 0) {
                    toggleAccordion(this);
                    if (window.htmx) {
                        htmx.ajax("GET", this.getAttribute("hx-get"), {
                            target: this.getAttribute("hx-target"),
                            swap: "innerHTML",
                        });
                    }
                    return false;
                }
            });
        });
    {% endif %}
    function batchNoChange(selectElement) {
        var selectedBatchNo = selectElement.val();
        var parentForm = selectElement.parents().closest("form");
        var dataId = parentForm.data("id");
        if (selectedBatchNo == "create") {
            let dynamicBatchNo = $("#dynamicBatchNoModal");
            var view = parentForm.serialize()
            view += `&asset_category_id=${dataId}`;
            dynamicBatchNo.attr("hx-vals", `{"data":"${view}"}`);
            dynamicBatchNo.click();
        }
    }
    function isElementVisible(element) {
        const $targetSelector = $(element).attr("hx-target");
        const $targetEl = $($targetSelector);
        const isOpen = $targetEl.css("max-height") && $targetEl.css("max-height") !== "0px";

        return !isOpen;
    }

    $(".dropdown-toggle").on("click", function () {
        const dropdownMenu = $(this).next(".dropdown-menu");
        const isOpen = dropdownMenu.is(":visible");

        $(".dropdown-menu").not(dropdownMenu).hide();

        if (isOpen) {
            dropdownMenu.hide();
        } else {
            dropdownMenu.show();
        }
    });
</script>
