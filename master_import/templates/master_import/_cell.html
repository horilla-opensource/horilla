{% comment %}One editable value. ``cell`` carries the field, value, kind, options and any problem; ``row`` is the row it belongs to.{% endcomment %}
{% if cell.kind == "choice" %}<select class="mi__cell {% if cell.bad %}mi__cell--bad{% endif %}" data-row="{{ row }}" data-field="{{ cell.field }}" data-orig="{{ cell.value }}" {% if cell.bad %}title="{{ cell.bad }}"{% endif %}><option value=""></option>{% for o in cell.options %}<option value="{{ o.value }}" {% if o.value == cell.value %}selected{% endif %}>{{ o.label }}</option>{% endfor %}</select>{% else %}<input class="mi__cell {% if cell.bad %}mi__cell--bad{% endif %}" type="{{ cell.kind }}" {% if cell.kind == 'number' %}step="any"{% endif %} data-row="{{ row }}" data-field="{{ cell.field }}" value="{{ cell.value }}" data-orig="{{ cell.value }}" {% if cell.bad %}title="{{ cell.bad }}"{% endif %}>{% endif %}
