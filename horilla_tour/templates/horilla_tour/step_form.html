{% load i18n %}
<form
    hx-post="{% url 'tour-step-form' %}?tour_id={{ tour.id }}{% if step %}&step_id={{ step.id }}{% endif %}"
    hx-target="#tourStepsPanel" hx-swap="outerHTML"
    class="border border-gray-200 rounded-md p-4 bg-gray-50">
    {% csrf_token %}
    <h4 class="text-sm font-semibold text-gray-800 mb-3">
        {% if step %}{% trans "Edit step" %}{% else %}{% trans "Add step" %}{% endif %}
    </h4>

    {% for field in form %}
    <div class="mb-3">
        <label class="block text-sm font-medium text-gray-700 mb-1" for="{{ field.id_for_label }}">
            {{ field.label }}
        </label>
        {{ field }}
        {% if field.help_text %}
        <p class="text-xs text-gray-400 mt-1">{{ field.help_text }}</p>
        {% endif %}
        {% for error in field.errors %}
        <p class="text-xs text-red-500 mt-1">{{ error }}</p>
        {% endfor %}
    </div>
    {% endfor %}

    <div class="flex justify-end gap-2 mt-3">
        <button type="submit"
            class="inline-flex items-center gap-1 px-4 py-2 rounded-md bg-primary-600 text-white text-sm font-medium hover:opacity-90 transition">
            {% trans "Save step" %}
        </button>
    </div>
</form>
