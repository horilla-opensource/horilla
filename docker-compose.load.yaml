services:
  load:
    build:
      context: .
      dockerfile: Dockerfile.load
    image: ${HYDRA_LOAD_IMAGE:-hydra-load:local}
    profiles: [load]
    environment:
      HYDRA_LOAD_TEST_RUN_ID: ${HYDRA_LOAD_TEST_RUN_ID:?HYDRA_LOAD_TEST_RUN_ID is required}
      HYDRA_LOAD_TEST_PASSWORD: ${HYDRA_LOAD_TEST_PASSWORD:?HYDRA_LOAD_TEST_PASSWORD is required}
      HYDRA_LOAD_USERS: ${HYDRA_LOAD_USERS:?HYDRA_LOAD_USERS is required}
      HYDRA_LOAD_SHAPE: ${HYDRA_LOAD_SHAPE:-standard}
      HYDRA_LOAD_HOST_HEADER: ${HYDRA_LOAD_HOST_HEADER:-localhost}
    command:
      - --locustfile
      - /load/locustfile.py
      - --headless
      - --host
      - http://proxy:8080
      - --users
      - ${HYDRA_LOAD_USERS:?HYDRA_LOAD_USERS is required}
      - --spawn-rate
      - ${HYDRA_LOAD_SPAWN_RATE:?HYDRA_LOAD_SPAWN_RATE is required}
      - --run-time
      - ${HYDRA_LOAD_DURATION:?HYDRA_LOAD_DURATION is required}
      - --csv
      - /artifacts/locust
      - --csv-full-history
      - --html
      - /artifacts/locust-report.html
      - --only-summary
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    volumes:
      - type: bind
        source: ${HYDRA_LOAD_ARTIFACTS_PATH:?HYDRA_LOAD_ARTIFACTS_PATH is required}
        target: /artifacts
    depends_on:
      proxy: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}
